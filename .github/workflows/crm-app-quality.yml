name: CRM app quality

on:
  # La regla de Main exige verify en toda PR; un filtro paths lo dejaría pendiente.
  pull_request:
  push:
    branches: [main, tronco]
    paths:
      - 'CRM-Avance-Corp/app/**'
      - '.github/workflows/crm-app-quality.yml'

permissions:
  contents: read

concurrency:
  group: crm-app-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CRM-Avance-Corp/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CRM-Avance-Corp/app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, typecheck and test with coverage
        run: npm run check

      - name: Build production bundle
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CRM-Avance-Corp/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CRM-Avance-Corp/app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke por rol (modo demo)
        # La suite tiene más de 200 casos. Un solo worker agotaba los 20 min;
        # cada prueba usa su contexto y backend interceptado independientes.
        run: npm run test:e2e -- --workers=2

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            CRM-Avance-Corp/app/playwright-report/
            CRM-Avance-Corp/app/test-results/
          retention-days: 7
