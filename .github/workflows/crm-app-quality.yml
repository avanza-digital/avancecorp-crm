name: CRM app quality

on:
  pull_request:
    paths:
      - 'CRM-Avance-Corp/app/**'
      - '.github/workflows/crm-app-quality.yml'
  push:
    branches: [main]
    paths:
      - 'CRM-Avance-Corp/app/**'
      - '.github/workflows/crm-app-quality.yml'

permissions:
  contents: read

concurrency:
  group: crm-app-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CRM-Avance-Corp/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CRM-Avance-Corp/app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, typecheck and test with coverage
        run: npm run check

      - name: Build production bundle
        run: npm run build
