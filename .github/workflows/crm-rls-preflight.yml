name: CRM RLS preflight

on:
  # SIN filtro `paths` en `pull_request`, A PROPÓSITO (igual que crm-app-quality.yml).
  # Desde el 04/10 el ruleset «crm-backend-preflight-obligatorio» exige el check
  # `preflight` en toda PR a `main`, y un workflow que no se dispara NO publica su
  # resultado: una PR que solo toca la app se quedaba «Expected — Waiting for status»
  # para siempre (#186/#187). Corre entero en toda PR: son ~2–3 min y no se salta nada.
  pull_request:
  push:
    branches: [main, tronco]
    paths:
      - 'CRM-Avance-Corp/package.json'
      - 'CRM-Avance-Corp/package-lock.json'
      - 'CRM-Avance-Corp/deno.lock'
      - 'CRM-Avance-Corp/supabase/scripts/**'
      - 'CRM-Avance-Corp/supabase/functions/crm-tipo-cambio/**'
      - '_supabase_functions/functions/**'
      - '.github/workflows/crm-rls-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-rls-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: CRM-Avance-Corp
    env:
      # Valores deliberadamente ficticios. Los comandos --preflight no abren red.
      SUPABASE_URL: https://crm-rls-preflight.invalid
      SUPABASE_ANON_KEY: preflight-anon-key-not-a-secret
      SUPABASE_SERVICE_ROLE_KEY: preflight-service-key-not-a-secret
      CRM_DEMO_PASSWORD: preflight-password-not-a-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CRM-Avance-Corp/package-lock.json

      - name: Use Deno 2.9.4
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Install locked dependencies
        run: npm ci

      - name: Check script syntax
        run: npm run check:scripts

      - name: Validate seed preflight without network
        run: npm run seed:preflight

      - name: Validate RLS matrix preflight without network
        run: npm run test:rls:preflight

      # Fronteras PURAS de las edge functions (atribución de la conversión y
      # datos bancarios obligatorios). Existían con test desde 2026-07-17 pero
      # nadie los corría en CI: se ejecutan aquí, sin red.
      - name: Validate edge function boundaries
        run: npm run test:edge-preflight
