<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Navegación móvil · Vista local de Avance Corp</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: #eaece9; color: #16334d; font-family: system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; padding: 19px 30px; background: #fff; border-bottom: 1px solid #dbe1e4; }
    h1 { font-size: 16px; margin: 0 0 5px; } p { font-size: 12px; margin: 0; color: #607080; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; } button { background: #f1f3f4; color: #34495a; border: 1px solid #d9dfe3; border-radius: 7px; padding: 10px 15px; cursor: pointer; font: inherit; font-size: 12px; }
    button[aria-pressed="true"] { color: white; background: #16334d; border-color: #16334d; } button:focus-visible { outline: 3px solid #b88b38; outline-offset: 3px; }
    main { padding: 24px 14px 35px; } .frame { width: 392px; max-width: 100%; margin: auto; background: #fff; border: 1px solid #cbd2d5; border-radius: 18px; overflow: hidden; box-shadow: 0 16px 46px #16334d16; }
    .frame.desktop { width: min(1440px, 100%); border-radius: 8px; } iframe { display: block; border: 0; width: 100%; height: clamp(480px, calc(100dvh - 200px), 844px); } .desktop iframe { height: clamp(600px, calc(100dvh - 200px), 900px); }
    footer { text-align: center; color: #63717e; font-size: 11px; margin: 18px 0 0; line-height: 1.6; } a { color: #1f4e79; }
    @media(max-width: 600px) { header { padding: 16px; } main { padding: 12px 0; } .frame { border-radius: 0; border: 0; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Avance Corp · PWA de Gerencia</h1><p>Vista local · Pendientes, filtros y pantallas móviles</p></div>
    <nav aria-label="Comparar presentación">
      <button data-size="390" aria-pressed="true">Celular · 390 px</button>
      <button data-size="430" aria-pressed="false">Celular · 430 px</button>
      <button data-size="desktop" aria-pressed="false">Escritorio actual</button>
    </nav>
  </header>
  <main>
    <div class="frame" id="frame"><iframe src="/#/hoy" title="CRM de Gerencia en tamaño móvil"></iframe></div>
    <footer>Prueba los cuatro accesos inferiores y abre «Más». Esta sesión demo muestra datos de ejemplo.<br>Selecciona «Explorar en modo demo» → «Gerencia» si aparece el acceso. <a href="/#/hoy" target="_blank" rel="noopener">Abrir CRM directamente</a></footer>
  </main>
  <script type="module">
    if (!import.meta.env.DEV) document.body.replaceChildren()
    else for (const button of document.querySelectorAll('[data-size]')) button.addEventListener('click', () => {
      const desktop = button.dataset.size === 'desktop'
      const frame = document.getElementById('frame')
      frame.classList.toggle('desktop', desktop)
      frame.style.width = desktop ? '' : `${Number(button.dataset.size) + 2}px`
      for (const option of document.querySelectorAll('[data-size]')) option.setAttribute('aria-pressed', String(option === button))
    })
  </script>
</body>
</html>
