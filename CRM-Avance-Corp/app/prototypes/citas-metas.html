  border-color: var(--input);

.form-check:not(.form-switch)

      &lt;div class=&quot;mi-location&quot;&gt;&lt;span class=&quot;mi-location-label&quot;&gt;&lt;i data-lucide=&quot;chart-no-axes-combined&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Resultados&lt;/span&gt;&lt;span class=&quot;mi-small&quot; id=&quot;mi-period&quot;&gt;Avance acumulado del 1 al 10 set. · Soles&lt;/span&gt;&lt;/div&gt;
      &lt;div id=&quot;mi-message&quot; class=&quot;mi-empty&quot; role=&quot;status&quot; hidden&gt;&lt;/div&gt;
      &lt;div id=&quot;mi-results&quot;&gt;
        &lt;section class=&quot;mi-panel&quot; aria-labelledby=&quot;mi-recovery-title&quot;&gt;
          &lt;div class=&quot;mi-panel-head&quot;&gt;&lt;h3 id=&quot;mi-recovery-title&quot;&gt;¿Qué pasó con quienes no asistieron?&lt;/h3&gt;&lt;span class=&quot;mi-small&quot;&gt;Personas del recorrido&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;mi-flow&quot;&gt;
            &lt;button class=&quot;mi-stage&quot; type=&quot;button&quot; data-stage=&quot;missed&quot; aria-controls=&quot;mi-recovery-details&quot; aria-pressed=&quot;false&quot;&gt;&lt;b id=&quot;mi-missed&quot;&gt;4&lt;/b&gt;&lt;span&gt;No asistieron&lt;/span&gt;&lt;/button&gt;
            &lt;button class=&quot;mi-stage&quot; type=&quot;button&quot; data-stage=&quot;rescheduled&quot; aria-controls=&quot;mi-recovery-details&quot; aria-pressed=&quot;false&quot;&gt;&lt;b id=&quot;mi-rescheduled&quot;&gt;3&lt;/b&gt;&lt;span&gt;Reprogramaron&lt;/span&gt;&lt;/button&gt;
            &lt;button class=&quot;mi-stage&quot; type=&quot;button&quot; data-stage=&quot;attended&quot; aria-controls=&quot;mi-recovery-details&quot; aria-pressed=&quot;false&quot;&gt;&lt;b id=&quot;mi-attended&quot;&gt;1&lt;/b&gt;&lt;span&gt;Asistieron&lt;/span&gt;&lt;/button&gt;
            &lt;button class=&quot;mi-stage&quot; type=&quot;button&quot; data-stage=&quot;converted&quot; aria-controls=&quot;mi-recovery-details&quot; aria-pressed=&quot;false&quot;&gt;&lt;b id=&quot;mi-converted&quot;&gt;1&lt;/b&gt;&lt;span&gt;Depositaron&lt;/span&gt;&lt;/button&gt;
            &lt;div class=&quot;mi-flow-total&quot;&gt;&lt;b id=&quot;mi-recovered-rate&quot;&gt;25%&lt;/b&gt;&lt;small id=&quot;mi-recovered-base&quot;&gt;1 de 4 terminó en cliente&lt;/small&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;details class=&quot;mi-detail&quot; id=&quot;mi-recovery-details&quot;&gt;&lt;summary id=&quot;mi-recovery-summary&quot;&gt;Ver personas del recorrido&lt;/summary&gt;&lt;div class=&quot;mi-scroll&quot;&gt;&lt;table class=&quot;mi-members&quot; aria-label=&quot;Personas de la etapa de recuperación seleccionada&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Persona&lt;/th&gt;&lt;th&gt;Analista&lt;/th&gt;&lt;th&gt;No asistió&lt;/th&gt;&lt;th&gt;Reprogramó&lt;/th&gt;&lt;th&gt;Asistencia&lt;/th&gt;&lt;th&gt;Depósito&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;mi-recovery-rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
        &lt;/section&gt;
        &lt;section class=&quot;mi-panel&quot; aria-labelledby=&quot;mi-metas-title&quot;&gt;
          &lt;div class=&quot;mi-panel-head&quot;&gt;&lt;div&gt;&lt;h3 id=&quot;mi-metas-title&quot;&gt;Avance de metas por analista&lt;/h3&gt;&lt;span class=&quot;mi-small&quot;&gt;Citas, entrevistas y clientes en una sola fila&lt;/span&gt;&lt;/div&gt;&lt;span id=&quot;mi-roster&quot; class=&quot;mi-state&quot;&gt;3 analistas&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;mi-scroll&quot;&gt;&lt;table class=&quot;mi-metrics&quot; aria-label=&quot;Cumplimiento y proyección por analista&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Analista&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Citas&lt;small&gt;Cumplimiento del objetivo&lt;/small&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Entrevistas&lt;small&gt;Asistencia · objetivo 70%&lt;/small&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Depósitos&lt;small&gt;Conversión · objetivo 70%&lt;/small&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Ticket medio&lt;small&gt;Referencia histórica&lt;/small&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Cierre estimado&lt;small&gt;Si mantiene su ritmo&lt;/small&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;mi-metric-rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
          &lt;div class=&quot;mi-footnote&quot;&gt;Base: leads asignados, excluyendo el registro manual del propio analista. Detalle al seleccionar su nombre.&lt;/div&gt;
          &lt;details class=&quot;mi-detail&quot; id=&quot;mi-analyst-details&quot;&gt;&lt;summary id=&quot;mi-analyst-summary&quot;&gt;Detalle del avance · Ana&lt;/summary&gt;&lt;div class=&quot;mi-detail-body&quot; id=&quot;mi-analyst-body&quot;&gt;&lt;/div&gt;&lt;/details&gt;
        &lt;/section&gt;
      &lt;/div&gt;
      &lt;div class=&quot;mi-sr&quot; id=&quot;mi-live&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;/main&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;citas-metas-integradas&#x27;);
  const q = selector =&gt; root.querySelector(selector);
  const people = [
    { id: &#x27;ana&#x27;, name: &#x27;Ana&#x27;, supervisor: &#x27;norte&#x27;, ticket: 20000, weeks: [{ leads: 65, appointments: 60, interviews: 42, clients: 21 }, { leads: 35, appointments: 40, interviews: 28, clients: 14 }] },
    { id: &#x27;bruno&#x27;, name: &#x27;Bruno&#x27;, supervisor: &#x27;sur&#x27;, ticket: 15000, weeks: [{ leads: 60, appointments: 50, interviews: 25, clients: 18 }, { leads: 40, appointments: 30, interviews: 15, clients: 10 }] },
    { id: &#x27;carla&#x27;, name: &#x27;Carla&#x27;, supervisor: &#x27;norte&#x27;, ticket: 25000, weeks: [{ leads: 30, appointments: 40, interviews: 28, clients: 20 }, { leads: 18, appointments: 20, interviews: 14, clients: 10 }] }
  ];
  const recovery = [
    { name: &#x27;Carolina Vega&#x27;, analyst: &#x27;ana&#x27;, missed: 2, rescheduled: 3, attended: 4, converted: 6 },
    { name: &#x27;Manuel Torres&#x27;, analyst: &#x27;ana&#x27;, missed: 5, rescheduled: null, attended: null, converted: null },
    { name: &#x27;Lucía Ortiz&#x27;, analyst: &#x27;bruno&#x27;, missed: 8, rescheduled: 9, attended: null, converted: null },
    { name: &#x27;José López&#x27;, analyst: &#x27;carla&#x27;, missed: 9, rescheduled: 10, attended: null, converted: null }
  ];
  const state = { selected: &#x27;ana&#x27;, stage: &#x27;missed&#x27;, showBars: true };
  const integer = new Intl.NumberFormat(&#x27;es-PE&#x27;, { maximumFractionDigits: 0 });
  const decimal = new Intl.NumberFormat(&#x27;es-PE&#x27;, { maximumFractionDigits: 1 });
  const cash = value =&gt; &#x27;S/ &#x27; + integer.format(value);
  const pct = value =&gt; decimal.format(value) + &#x27;%&#x27;;
  const cutoff = () =&gt; q(&#x27;#mi-week&#x27;).value === &#x27;1&#x27; ? 7 : 10;
  const scope = () =&gt; people.filter(person =&gt; (q(&#x27;#mi-supervisor&#x27;).value === &#x27;all&#x27; || person.supervisor === q(&#x27;#mi-supervisor&#x27;).value) &amp;&amp; (q(&#x27;#mi-analyst&#x27;).value === &#x27;all&#x27; || person.id === q(&#x27;#mi-analyst&#x27;).value));
  const stageLabels = { missed: &#x27;No asistieron&#x27;, rescheduled: &#x27;Reprogramaron&#x27;, attended: &#x27;Asistieron&#x27;, converted: &#x27;Depositaron&#x27; };
  const day = value =&gt; value &amp;&amp; value &lt;= cutoff() ? value + &#x27; set.&#x27; : &#x27;—&#x27;;
  function syncAnalystChoices() {
    const select = q(&#x27;#mi-analyst&#x27;);
    const previous = select.value;
    const supervisor = q(&#x27;#mi-supervisor&#x27;).value;
    const available = people.filter(person =&gt; supervisor === &#x27;all&#x27; || person.supervisor === supervisor);
    select.innerHTML = &#x27;&lt;option value=&quot;all&quot;&gt;Todos&lt;/option&gt;&#x27; + available.map(person =&gt; `&lt;option value=&quot;${person.id}&quot;&gt;${person.name}&lt;/option&gt;`).join(&#x27;&#x27;);
    select.value = available.some(person =&gt; person.id === previous) ? previous : &#x27;all&#x27;;
  }
  function metrics(person) {
    const selectedWeeks = cutoff() === 7 ? person.weeks.slice(0, 1) : person.weeks;
    const result = selectedWeeks.reduce((sum, week) =&gt; ({ leads: sum.leads + week.leads, appointments: sum.appointments + week.appointments, interviews: sum.interviews + week.interviews, clients: sum.clients + week.clients }), { leads: 0, appointments: 0, interviews: 0, clients: 0 });
    const appointmentGoal = Math.ceil(result.leads * 125 / 100);
    const interviewGoal = Math.ceil(result.appointments * 70 / 100);
    const clientGoal = Math.ceil(result.interviews * 70 / 100);
    const attendance = result.interviews / result.appointments;
    const conversion = result.clients / result.interviews;
    const monthlyAppointments = result.appointments * 30 / cutoff();
    const expectedClients = monthlyAppointments * attendance * conversion;
    return { ...result, appointmentGoal, interviewGoal, clientGoal, attendance, conversion, monthlyAppointments, expectedClients, expectedAmount: expectedClients * person.ticket, goalAmount: monthlyAppointments * .7 * .7 * person.ticket };
  }
  function track(value, target) {
    if (!state.showBars) return &#x27;&#x27;;
    return `&lt;div class=&quot;mi-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;mi-fill&quot; style=&quot;width:${Math.min(100, Math.max(0, value))}%&quot;&gt;&lt;/div&gt;&lt;span class=&quot;mi-tick&quot; style=&quot;left:calc(${target}% - 1px)&quot;&gt;&lt;/span&gt;&lt;/div&gt;`;
  }
  function renderMetrics() {
    const selectedPeople = scope();
    q(&#x27;#mi-roster&#x27;).textContent = selectedPeople.length + (selectedPeople.length === 1 ? &#x27; analista&#x27; : &#x27; analistas&#x27;);
    q(&#x27;#mi-metric-rows&#x27;).innerHTML = selectedPeople.map(person =&gt; {
      const m = metrics(person);
      const accomplishment = m.appointments / m.appointmentGoal * 100;
      const expected = Math.abs(m.expectedClients - Math.round(m.expectedClients)) &lt; .000001 ? integer.format(m.expectedClients) : &#x27;≈ &#x27; + decimal.format(m.expectedClients);
      return `&lt;tr&gt;&lt;td&gt;&lt;button class=&quot;mi-person&quot; type=&quot;button&quot; data-analyst=&quot;${person.id}&quot; aria-controls=&quot;mi-analyst-details&quot; aria-label=&quot;Ver avance de ${person.name}&quot;&gt;${person.name}&lt;/button&gt;&lt;span class=&quot;mi-meta&quot;&gt;${person.supervisor === &#x27;norte&#x27; ? &#x27;Norte&#x27; : &#x27;Sur&#x27;}&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;mi-number&quot;&gt;${pct(accomplishment)}&lt;/span&gt;&lt;span class=&quot;mi-meta&quot;&gt;${m.appointments} citas · ${m.leads} leads&lt;/span&gt;${track(accomplishment, 100)}&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;mi-number&quot;&gt;${pct(m.attendance * 100)}&lt;/span&gt;&lt;span class=&quot;mi-meta&quot;&gt;${m.interviews} de ${m.appointments} citas&lt;/span&gt;${track(m.attendance * 100, 70)}&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;mi-number&quot;&gt;${pct(m.conversion * 100)}&lt;/span&gt;&lt;span class=&quot;mi-meta&quot;&gt;${m.clients} de ${m.interviews} entrevistados&lt;/span&gt;${track(m.conversion * 100, 70)}&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;mi-number-money&quot;&gt;${cash(person.ticket)}&lt;/span&gt;&lt;span class=&quot;mi-meta&quot;&gt;Por nuevo cliente&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;mi-number-money&quot;&gt;${cash(m.expectedAmount)}&lt;/span&gt;&lt;span class=&quot;mi-meta&quot;&gt;${expected} clientes previstos&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;`;
    }).join(&#x27;&#x27;);
  }
  function detailMetric(label, done, goal, unit) {
    const missing = Math.max(0, goal - done);
    return `&lt;tr&gt;&lt;td&gt;${label}&lt;/td&gt;&lt;td&gt;${done} / ${goal}&lt;/td&gt;&lt;td&gt;${missing ? &#x27;Faltan &#x27; + missing + &#x27; &#x27; + unit : &#x27;Objetivo alcanzado&#x27;}&lt;/td&gt;&lt;/tr&gt;`;
  }
  function renderAnalystDetail() {
    const person = scope().find(candidate =&gt; candidate.id === state.selected) || scope()[0];
    if (!person) return;
    state.selected = person.id;
    const m = metrics(person);
    q(&#x27;#mi-analyst-summary&#x27;).textContent = &#x27;Detalle del avance · &#x27; + person.name;
    q(&#x27;#mi-analyst-body&#x27;).innerHTML = `&lt;table class=&quot;mi-detail-table&quot; aria-label=&quot;Avance de ${person.name} frente a objetivos&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Indicador&lt;/th&gt;&lt;th&gt;Conseguido / objetivo&lt;/th&gt;&lt;th&gt;Para llegar&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${detailMetric(&#x27;Citas&#x27;, m.appointments, m.appointmentGoal, &#x27;citas&#x27;)}${detailMetric(&#x27;Entrevistas&#x27;, m.interviews, m.interviewGoal, &#x27;asistencias&#x27;)}${detailMetric(&#x27;Depósitos&#x27;, m.clients, m.clientGoal, &#x27;clientes&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;mi-detail-bottom&quot;&gt;&lt;span&gt;${m.leads} leads válidos · ${decimal.format(m.appointments / m.leads)} citas por lead&lt;/span&gt;&lt;span&gt;Con ambos porcentajes al 70%: ${cash(m.goalAmount)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mi-detail-bottom&quot;&gt;&lt;span&gt;${decimal.format(m.monthlyAppointments)} citas estimadas al cierre · ticket de ejemplo ${cash(person.ticket)}&lt;/span&gt;&lt;span&gt;Brechas calculadas sobre las bases del corte&lt;/span&gt;&lt;/div&gt;`;
  }
  function recoveryScope() {
    const ids = scope().map(person =&gt; person.id);
    return recovery.filter(person =&gt; ids.includes(person.analyst) &amp;&amp; person.missed &lt;= cutoff());
  }
  function renderRecovery() {
    const records = recoveryScope();
    for (const stage of Object.keys(stageLabels)) q(&#x27;#mi-&#x27; + stage).textContent = records.filter(person =&gt; person[stage] &amp;&amp; person[stage] &lt;= cutoff()).length;
    const converted = records.filter(person =&gt; person.converted &amp;&amp; person.converted &lt;= cutoff()).length;
    q(&#x27;#mi-recovered-rate&#x27;).textContent = records.length ? pct(converted / records.length * 100) : &#x27;—&#x27;;
    q(&#x27;#mi-recovered-base&#x27;).textContent = records.length ? converted + &#x27; de &#x27; + records.length + &#x27; terminó en cliente&#x27; : &#x27;Sin inasistencias en este ejemplo&#x27;;
    q(&#x27;#mi-recovery-summary&#x27;).textContent = stageLabels[state.stage] + &#x27; · Ver personas del recorrido&#x27;;
    const filtered = records.filter(person =&gt; person[state.stage] &amp;&amp; person[state.stage] &lt;= cutoff());
    q(&#x27;#mi-recovery-rows&#x27;).innerHTML = filtered.length ? filtered.map(person =&gt; `&lt;tr&gt;&lt;td&gt;${person.name}&lt;/td&gt;&lt;td&gt;${people.find(analyst =&gt; analyst.id === person.analyst).name}&lt;/td&gt;&lt;td&gt;${day(person.missed)}&lt;/td&gt;&lt;td&gt;${day(person.rescheduled)}&lt;/td&gt;&lt;td&gt;${day(person.attended)}&lt;/td&gt;&lt;td&gt;${day(person.converted)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : &#x27;&lt;tr&gt;&lt;td colspan=&quot;6&quot;&gt;Nadie ha llegado a esta etapa en el ejemplo seleccionado.&lt;/td&gt;&lt;/tr&gt;&#x27;;
    root.querySelectorAll(&#x27;[data-stage]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(q(&#x27;#mi-recovery-details&#x27;).open &amp;&amp; state.stage === button.dataset.stage)));
  }
  function render() {
    let message = &#x27;&#x27;;
    if (q(&#x27;#mi-month&#x27;).value !== &#x27;2026-09&#x27;) message = &#x27;La propuesta tiene datos de ejemplo de septiembre de 2026.&#x27;;
    else if ([&#x27;3&#x27;, &#x27;4&#x27;].includes(q(&#x27;#mi-week&#x27;).value)) message = &#x27;Semana posterior al corte del ejemplo (10 set.). Todavía no hay actividad para mostrar.&#x27;;
    else if (!scope().length) message = &#x27;El analista seleccionado no pertenece a este supervisor.&#x27;;
    q(&#x27;#mi-message&#x27;).hidden = !message;
    q(&#x27;#mi-message&#x27;).textContent = message;
    q(&#x27;#mi-results&#x27;).hidden = Boolean(message);
    q(&#x27;#mi-period&#x27;).textContent = message ? &#x27;Datos de ejemplo · Soles&#x27; : &#x27;Avance acumulado del 1 al &#x27; + cutoff() + &#x27; set. · Soles&#x27;;
    if (message) { q(&#x27;#mi-live&#x27;).textContent = message; return; }
    renderMetrics();
    renderRecovery();
    renderAnalystDetail();
    q(&#x27;#mi-live&#x27;).textContent = scope().length + &#x27; analistas. Avance acumulado hasta el &#x27; + cutoff() + &#x27; de septiembre.&#x27;;
  }
  [&#x27;#mi-month&#x27;, &#x27;#mi-week&#x27;, &#x27;#mi-analyst&#x27;].forEach(selector =&gt; q(selector).addEventListener(&#x27;change&#x27;, render));
  q(&#x27;#mi-supervisor&#x27;).addEventListener(&#x27;change&#x27;, () =&gt; { syncAnalystChoices(); render(); });
  q(&#x27;#mi-metric-rows&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
    const button = event.target.closest(&#x27;button[data-analyst]&#x27;);
    if (!button) return;
    state.selected = button.dataset.analyst;
    renderAnalystDetail();
    q(&#x27;#mi-analyst-details&#x27;).open = true;
    q(&#x27;#mi-analyst-summary&#x27;).focus();
  });
  root.querySelectorAll(&#x27;[data-stage]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    state.stage = button.dataset.stage;
    q(&#x27;#mi-recovery-details&#x27;).open = true;
    renderRecovery();
    q(&#x27;#mi-recovery-summary&#x27;).focus();
  }));
  q(&#x27;#mi-recovery-details&#x27;).addEventListener(&#x27;toggle&#x27;, renderRecovery);
  syncAnalystChoices();
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: render });
    tweak.addToggle(state, &#x27;showBars&#x27;, { label: &#x27;Mostrar barras de avance&#x27; });
  }
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
