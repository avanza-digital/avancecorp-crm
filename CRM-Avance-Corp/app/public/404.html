<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#111e3d" />
    <title>Página no encontrada · CRM Avance Corp</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background: #f6f8fc;
        color: #111e3d;
      }

      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #dce3ef;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(17 30 61 / 10%);
        text-align: center;
      }

      strong {
        display: block;
        margin-bottom: 12px;
        color: #2563eb;
        font-size: 12px;
        letter-spacing: 0.16em;
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      p {
        margin: 12px 0 24px;
        color: #58647a;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 11px 18px;
        border-radius: 10px;
        background: #111e3d;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #93b4ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>AVANCE CORP · CRM</strong>
      <h1>Página no encontrada</h1>
      <p>La dirección solicitada no existe dentro del CRM.</p>
      <a href="/">Volver al CRM</a>
    </main>
  </body>
</html>
