// ─────────────────────────────────────────────────────────────────────────────
// EL SERVIDOR DE LA FASE 3B, simulado: crm.listar_operaciones_facturacion_fn.
//   Capa 1 (qué operaciones): las MISMAS que forman la cifra de quien mira (Gerencia: todas; la supervisora: las de
//   su equipo de entonces), con los filtros encima.
//   Capa 2 (qué datos): Gerencia lo ve todo; la supervisora ve el cliente solo si HOY lo atiende su equipo. Si no,
//   la fila llega como «Cliente de otro equipo», con su importe y SIN nombre, N.º, cooperativa ni ningún id.
//   Orden total (fecha, tipo, id); `n` es la posición 1..total; páginas de 25, 50 o 100. PEN y USD jamás se suman.
// ─────────────────────────────────────────────────────────────────────────────
const servidor = {
  version: 1,
  listar(p) {
    const fallo = (mensaje) => { const e = new Error(mensaje); e.code = '22023'; throw e }
    if (!p.desde || !p.hasta || p.hasta < p.desde) fallo('Las fechas de la lista no son válidas.')
    if (diasEntre(p.desde, p.hasta) > 30) fallo('La lista abarca como mucho 31 días.')
    if (![25, 50, 100].includes(p.tamano)) fallo('Las páginas son de 25, 50 o 100 filas.')
    if (!Number.isInteger(p.pagina) || p.pagina < 1) fallo('La página no es válida.')
    if (p.moneda != null && p.moneda !== 'PEN' && p.moneda !== 'USD') fallo('La moneda no es válida.')
    if ((p.analistas && p.analistas.length === 0) || (p.tipos && p.tipos.length === 0)) fallo('Un filtro llegó vacío.')
    const mira = st.rol === 'supervisor' ? { global: false, sid: SUPERVISORA } : { global: true, sid: null }
    let ops = opsDeDias(p.dias ?? rangoDeDias(p.desde, p.hasta), this.version)
      .filter((o) => mira.global || o.supervisor_id === mira.sid)
    if (p.analistas) ops = ops.filter((o) => p.analistas.includes(o.analista_id))
    if (p.equipo) ops = ops.filter((o) => o.supervisor_id === p.equipo)
    if (p.tipos) ops = ops.filter((o) => p.tipos.includes(o.tipo))
    if (p.moneda) ops = ops.filter((o) => o.moneda === p.moneda)
    ops.sort((a, b) => a.fecha.localeCompare(b.fecha) || a.tipo.localeCompare(b.tipo) || a.operacion_id.localeCompare(b.operacion_id))
    const totales = ['PEN', 'USD'].map((moneda) => {
      const l = ops.filter((o) => o.moneda === moneda)
      return { moneda, operaciones: l.length, monto: l.reduce((s, o) => s + o.monto, 0) }
    }).filter((t) => t.operaciones > 0)
    const desde = (p.pagina - 1) * p.tamano
    const filas = ops.slice(desde, desde + p.tamano).map((o, i) => filaDeLaPuerta(o, desde + i + 1, mira))
    return { version: 1, pagina: p.pagina, tamano: p.tamano, total: ops.length, totales, filas }
  },
}
function filaDeLaPuerta(o, n, mira) {
  const visible = mira.global || o.equipo_cliente_hoy === mira.sid
  const f = {
    n, fecha: o.fecha, tipo: o.tipo, moneda: o.moneda, monto: o.monto, anulado: o.anulado,
    analista_id: o.analista_id, analista_nombre: o.analista_nombre, supervisor_id: o.supervisor_id, supervisor_nombre: o.supervisor_nombre,
    visible, cliente_nombre: visible ? o.cliente_nombre : 'Cliente de otro equipo',
  }
  if (!visible) return f
  f.estado = o.anulado ? 'anulado' : 'vigente'
  if (o.tipo === 'cooperativa') Object.assign(f, { cierre_externo_id: o.cierre_externo_id, cooperativa: o.cooperativa, lead_id: o.lead_id })
  else Object.assign(f, { contrato_id: o.contrato_id, numero_contrato: o.numero_contrato, cliente_id: o.cliente_id })
  return f
}

/** parametrosDeCifra(): de un número de la pantalla a los parámetros de la puerta. Puro. */
function paramsDe(spec, pagina = st.pagina, tamano = st.tamano) {
  const dias = [...spec.dias].sort()
  const p = { desde: dias[0], hasta: dias[dias.length - 1], pagina, tamano }
  // Días sueltos marcados a mano (2, 5 y 7): la puerta 3B solo recibe un rango. La pieza manda los días aparte
  // (`dias`) para que la lista cuadre; en la fase 3B hay que decidir cómo se pide esto (ver el informe).
  if (!seguidos(dias)) p.dias = dias
  if (spec.aid) p.analistas = [spec.aid]
  const equipo = spec.sid ?? (st.equipo || null)
  if (equipo) p.equipo = equipo
  const tipo = spec.tipo ?? (st.tipo !== 'todo' ? st.tipo : null)
  if (tipo) p.tipos = [tipo]
  const vistaL = spec.ambas ? 'TOTAL' : st.vista
  if (vistaL !== 'TOTAL') p.moneda = vistaL
  return p
}

// ─────────────────────────────────────────────────────────────────────────────
// LA HOJA LATERAL: cabecera en palabras, subtotales por moneda, la cuenta, avisos, la lista y las páginas.
// ─────────────────────────────────────────────────────────────────────────────
function queTxt(spec) {
  const tipo = spec.tipo ?? (st.tipo !== 'todo' ? st.tipo : null)
  let t = tipo ? `solo ${PLURAL_TIPO[tipo]}` : 'todas las operaciones'
  const vistaL = spec.ambas ? 'TOTAL' : st.vista
  if (vistaL === 'PEN') t += ' en soles'
  if (vistaL === 'USD') t += ' en dólares'
  return t
}
// El «·» va pegado a la palabra anterior (espacio duro): si el título se parte, nunca empieza una línea con «·».
const tituloDe = (spec) => `${spec.quien}${NBSP}· ${cuandoDe(spec.dias).replaceAll(' ', NBSP)}${NBSP}· ${queTxt(spec)}`
const htmlTipo = (tipo, apagado = false) => `<span class="f-tipo ${CLASE_TIPO[tipo]}${apagado ? ' apagado' : ''}">${ROTULO_TIPO[tipo]}</span>`
const htmlAnulada = (f) => (f.anulado ? '<span class="f-anulada" title="Anulada: aparece y cuenta igual (la anulación no descuenta el capital)">Anulada · cuenta igual</span>' : '')
const LINEA_AJENA = 'El cliente hoy lo atiende otro equipo: ves el importe, no sus datos'

function htmlCuenta(spec, resp, pen, usd, sumaMil, vistaL, cuadra) {
  const linea = (ic, principal, extra = '', claseExtra = '') => `<div class="l-cuenta${cuadra ? '' : ' no'}" id="lista-cuenta"><span class="l-cuenta-ic" aria-hidden="true">${icono(ic)}</span><div><p>${principal}</p>${extra ? `<p class="l-cuenta-extra ${claseExtra}">${extra}</p>` : ''}</div></div>`
  const penTxt = money(pen?.monto ?? 0, 'PEN')
  const desglose = vistaL === 'TOTAL'
    ? (usd ? `${penTxt} en soles + ${money(usd.monto, 'USD')} × ${TASA_TXT}` : `${penTxt}, todo en soles`)
    : vistaL === 'PEN' ? `${penTxt}, solo soles` : `${money(usd?.monto ?? 0, 'USD')}, solo dólares`
  const tasa = vistaL === 'TOTAL' && usd ? `Los dólares se pasan a soles con el ${ROTULO_TASA}; en la lista, soles y dólares nunca se suman.` : ''
  if (spec.modo === 'promedio') {
    const exacto = sumaMil / 1000 / spec.habiles
    const domingos = spec.dias.filter((d) => diaSemana(d) === 0)
    const fuera = domingos.length ? `, ${domingos.length === 1 ? `sin el domingo ${numeroDia(domingos[0])}` : 'sin los domingos'}` : ''
    return linea('calculator',
      `Pulsaste <b>${dinero(spec.valor, vistaL)}</b>, un promedio: esta lista suma <b>${dinero(sumaMil, vistaL)}</b> ÷ <b>${spec.habiles} ${spec.habiles === 1 ? 'día hábil' : 'días hábiles'}</b>.`,
      `Del ${cuandoDe(spec.dias)}${fuera}.${vistaL === 'TOTAL' && usd ? ` Suma: ${desglose}.` : ''}${Number.isInteger(exacto) ? '' : ' Redondeado al sol.'}`)
  }
  if (spec.modo === 'comparacion') {
    const c = spec.comp
    return linea('calculator',
      `Pulsaste <b>${c.texto}</b> = (ahora − antes) ÷ antes = (${dinero(c.ahora)} − ${dinero(c.antes)}) ÷ ${dinero(c.antes)}.`,
      `Esta lista es la de antes, ${esc(c.periodo)}: la base del porcentaje. <button type="button" class="l-enlace" data-accion="verAhora" data-foco="ver-ahora">Ver las de ahora${icono('arrowRight')}</button>`)
  }
  if (resp.total === 0 && spec.valor === 0) return linea('info', 'Pulsaste un cero: no hay operaciones detrás de este número.')
  if (!cuadra) {
    const pulsado = spec.modo === 'conteo' ? nf(spec.valor) : dinero(spec.valor, vistaL)
    const ahora = spec.modo === 'conteo' ? operaciones(resp.total) : dinero(sumaMil, vistaL)
    return linea('refresh', `Pulsaste <b>${pulsado}</b>, pero la lista ya ${spec.modo === 'conteo' ? 'tiene' : 'suma'} <b>${ahora}</b>.`)
  }
  if (spec.modo === 'conteo') return linea('circleCheck', `<b>Cuadra.</b> Pulsaste <b>${nf(spec.valor)}</b>: son estas ${operaciones(resp.total)}, en todas sus páginas.`)
  if (vistaL === 'TOTAL' && usd) return linea('circleCheck', `<b>Cuadra.</b> Pulsaste <b>${dinero(spec.valor, vistaL)}</b> = ${desglose}.`, tasa, 'l-cuenta-tasa')
  const cual = vistaL === 'USD' ? 'solo dólares' : vistaL === 'PEN' ? 'solo soles' : 'todo en soles'
  return linea('circleCheck', `<b>Cuadra.</b> Pulsaste <b>${dinero(spec.valor, vistaL)}</b> y la lista suma lo mismo, ${cual}.`)
}

  const avisos = [
    nuevas ? `<div class="l-aviso nuevas" role="status">${icono('refresh')}<div class="l-aviso-txt"><p class="l-aviso-fila"><b>Hay cifras nuevas</b><span aria-hidden="true">·</span><button type="button" class="l-actualizar" data-accion="actualizar" data-foco="actualizar">Actualizar</button></p><p>Alguien registró una operación después de que se cargó la hoja: la lista ya la trae y el número que pulsaste todavía no. Nada se recarga solo.</p></div></div>` : '',
    ajenas ? `<div class="l-aviso" role="note">${icono('eyeOff')}<p><b>Cliente de otro equipo</b> · ${ajenas === 1 ? '1 fila' : `${ajenas} filas`} de esta página. ${LINEA_AJENA}.</p></div>` : '',
  ].join('')
  let cuerpo
  if (resp.total === 0) {
    const d0 = spec.dias[0]
    const d = spec.dias.length === 1 ? `el ${DIAS_L[diaSemana(d0)]} ${numeroDia(d0)} de ${MESES[indiceMes(d0)]}` : `del ${cuandoDe(spec.dias)}`
    const tipo = spec.tipo ?? (st.tipo !== 'todo' ? st.tipo : null)
    const det = spec.aid
      ? `${esc(spec.quien)} no registró ${tipo ? PLURAL_TIPO[tipo] : 'operaciones'} ${d}${vistaL === 'TOTAL' ? '' : vistaL === 'PEN' ? ' en soles' : ' en dólares'}: por eso la hoja muestra un punto.`
      : `No hay operaciones detrás de este número ${d} con lo que estás viendo.`
    const claveFila = spec.aid ? `aT|${spec.aid}|${spec.sid}` : null
    const fila = claveFila && REG.get(claveFila)?.valor > 0 ? `<button type="button" class="f-boton" data-accion="verOtra" data-valor="${esc(claveFila)}" data-foco="ver-fila">Ver todas sus operaciones del ${esc(cuandoDe(REG.get(claveFila).dias))}${icono('arrowRight')}</button>` : ''
    cuerpo = `<div class="l-cuerpo"><div class="l-vacio"><span class="l-vacio-ic">${icono('listX')}</span><p class="l-vacio-titulo">Sin operaciones en este número</p><p class="l-vacio-det">${det}</p>${fila}</div></div>`
  } else if (movil) {
    const tarjetas = resp.filas.map((f) => {
      const oculta = !f.visible
      const cliente = oculta ? `<span class="l-ajeno">${icono('eyeOff')}Cliente de otro equipo</span>` : `<span data-nombre>${esc(f.cliente_nombre)}</span>`
      const numero = oculta ? '' : `<span class="tab">${esc(f.tipo === 'cooperativa' ? f.cooperativa : f.numero_contrato)}</span>`
      return `<div role="listitem" class="l-op${oculta ? ' oculta' : ''}">
        <div class="l-op-cab"><span class="l-op-n">${f.n}</span><p class="l-op-cli">${cliente}</p><p class="l-op-monto">${money(f.monto, f.moneda)}</p></div>
        <p class="l-op-det"><span>${diaCorto(f.fecha)}</span>${htmlTipo(f.tipo, oculta)}${numero}${htmlAnulada(f)}</p>
        <p class="l-op-quien"><span data-nombre>${esc(f.analista_nombre)}</span><span class="l-op-eq"> · ${esc(`equipo de ${f.supervisor_nombre}`).replaceAll(' ', NBSP)}</span></p>
        ${oculta ? `<p class="l-op-explica">${LINEA_AJENA}</p>` : ''}
      </div>`
    }).join('')
    cuerpo = `<div class="l-cuerpo ac-scroll" role="region" tabindex="0" aria-label="Operaciones de este número"><div role="list" class="l-ops">${tarjetas}</div></div>`
  } else {
    const filas = resp.filas.map((f) => {
      const oculta = !f.visible
      const cliente = oculta
        ? `<span class="l-ajeno">${icono('eyeOff')}Cliente de otro equipo</span>`
        : `<span class="l-nombre" data-nombre title="${esc(f.cliente_nombre)}">${esc(f.cliente_nombre)}</span>`
      const numero = oculta
        ? '<span class="l-vacio-dato" aria-hidden="true">—</span><span class="sr-only">sin dato</span>'
        : esc(f.tipo === 'cooperativa' ? f.cooperativa : f.numero_contrato)
      return `<tr class="${oculta ? 'oculta' : ''}"${oculta ? ` title="${LINEA_AJENA}"` : ''}>
        <td class="c-n">${f.n}</td>
        <td class="c-fecha">${diaCorto(f.fecha)}</td>
        <td class="c-tipo">${htmlTipo(f.tipo, oculta)}</td>
        <th scope="row" class="c-cli"><span class="c-cli-in">${cliente}${htmlAnulada(f)}</span></th>
        <td class="c-num">${numero}</td>
        <td class="c-ana" data-nombre>${esc(f.analista_nombre)}</td>
        <td class="c-sup" data-nombre>${esc(f.supervisor_nombre)}</td>
        <td class="c-monto">${money(f.monto, f.moneda)}</td>
      </tr>`
    }).join('')
    cuerpo = `<div class="l-cuerpo ac-scroll" role="region" tabindex="0" aria-label="Operaciones de este número"><table class="l-tabla">
      <caption class="sr-only">${esc(titulo)}: ${operaciones(resp.total)}, página ${resp.pagina}</caption>
      <thead><tr>
        <th scope="col" class="c-n"><span aria-hidden="true">#</span><span class="sr-only">Número de fila</span></th>
        <th scope="col" class="c-fecha">Fecha</th>
        <th scope="col" class="c-tipo">Tipo</th>
        <th scope="col" class="c-cli">Cliente</th>
        <th scope="col" class="c-num">N.º de contrato / Cooperativa</th>
        <th scope="col" class="c-ana">Analista</th>
        <th scope="col" class="c-sup">Supervisor</th>
        <th scope="col" class="c-monto">Monto</th>
      </tr></thead>
      <tbody>${filas}</tbody>
    </table></div>`
  }
  const paginas = Math.max(1, Math.ceil(resp.total / resp.tamano))
  const desde = (resp.pagina - 1) * resp.tamano + 1
  const hasta = Math.min(resp.total, resp.pagina * resp.tamano)
  const mostrando = `Mostrando ${nf(desde)}–${nf(hasta)} de ${nf(resp.total)}`
  const pie = resp.total === 0 ? '' : `<div class="l-pie">
    <p class="l-mostrando" id="lista-mostrando" tabindex="-1">${mostrando}</p>
    ${movil ? '' : `<p class="l-pista" aria-hidden="true">Desliza la tabla: N.º, Analista y Supervisor${icono('arrowRight')}</p>`}
    ${resp.total > 25 ? `<div class="l-tamanos" role="group" aria-label="Filas por página"><span class="l-tamanos-txt" aria-hidden="true">Filas por página</span>${[25, 50, 100].map((t) => `<button type="button" class="l-tam" data-accion="tamano" data-valor="${t}" data-foco="tam-${t}" aria-pressed="${t === resp.tamano}">${t}</button>`).join('')}</div>` : ''}
    ${paginas > 1 ? `<div class="l-paginas"><button type="button" class="f-boton" data-accion="paginaAnterior" data-foco="pag-ant" aria-label="Página anterior"${resp.pagina === 1 ? ' disabled' : ''}>${icono('chevronLeft')}Anterior</button><button type="button" class="f-boton" data-accion="paginaSiguiente" data-foco="pag-sig" aria-label="Página siguiente"${resp.pagina === paginas ? ' disabled' : ''}>Siguiente${icono('chevronRight')}</button></div>` : ''}
  </div>`
  const html = `<div class="l-cab">${cabeza}<div class="l-pastillas" role="group" aria-label="Subtotales de la lista">${pastillas}</div>${htmlCuenta(spec, resp, pen, usd, sumaMil, vistaL, cuadra)}</div>${avisos}${cuerpo}${pie}`
  return { html, info: { titulo, resumen: resp.total === 0 ? 'Sin operaciones en este número' : mostrando, cuadra, nuevas, total: resp.total, sumaMil } }
}

let tCierre = 0
function ocultarCaja(animar) {
  clearTimeout(tCierre)
  const fin = () => {
    caja.hidden = true
    caja.innerHTML = ''
    caja.className = ''
    caja.removeAttribute('role')
    caja.removeAttribute('aria-labelledby')
    document.body.classList.remove('con-lista')
  }
  if (caja.hidden) return fin()
  if (!animar || reducirMovimiento.matches) return fin()
  caja.classList.add('sale')
  tCierre = setTimeout(() => { if (st.lista == null) fin() }, 170)
}

function pintarLista(entrada) {
  const spec = st.lista != null ? REG.get(st.lista) : null
  if (!spec) {
    st.lista = null
    st.origenLista = null
    ocultarCaja(false)
    return null
  }
  const movil = anchoMarco() <= 640
  let resp
  try {
    resp = servidor.listar(paramsDe(spec))
    const paginas = Math.max(1, Math.ceil(resp.total / resp.tamano))
    if (st.pagina > paginas) { st.pagina = paginas; resp = servidor.listar(paramsDe(spec)) }
  } catch (e) {
    resp = { error: e.message }
  }
  const { html, info } = htmlPanel(spec, resp, movil)
  clearTimeout(tCierre)
  caja.hidden = false
  caja.className = 'l-panel'
  caja.setAttribute('role', 'region')
  caja.setAttribute('aria-labelledby', 'lista-titulo')
  caja.innerHTML = html
  document.body.classList.add('con-lista')
  if (!entrada) { void caja.offsetWidth; caja.classList.add('cambia') }
  // Si la tabla no cabe a lo ancho, una pista dice qué columnas hay a la derecha; se va al desplazarla.
  const cuerpo = caja.querySelector('.l-cuerpo')
  if (cuerpo && caja.querySelector('.l-tabla')) {
    caja.classList.toggle('desborda', cuerpo.scrollWidth > cuerpo.clientWidth + 1)
    cuerpo.addEventListener('scroll', () => { if (cuerpo.scrollLeft > 24) caja.classList.remove('desborda') }, { passive: true })
  }
  ultimaRespuesta = resp
  return info
}

function marcarAbierta() {
  document.querySelectorAll('#pantalla [data-cifra]').forEach((el) => el.classList.toggle('abierta', el.dataset.cifra === st.lista))
}

/** Con el panel abierto en escritorio, la hoja gana a la derecha el ancho que tapa el panel (ver el CSS). */
function ajustarHueco() {
  const abierta = st.lista != null && !caja.hidden && !esMovil()
  marco.classList.toggle('con-lista', abierta)
  if (!abierta) { marco.style.removeProperty('--hueco'); return }
  const region = document.querySelector('.f-region')
  if (!region) return
  const r = region.getBoundingClientRect()
  const m = marco.getBoundingClientRect()
  const izquierdaPanel = m.right - caja.offsetWidth
  marco.style.setProperty('--hueco', `${Math.max(0, Math.round(r.right - izquierdaPanel + 16))}px`)
}
/** Desplaza la hoja lo justo para que el número pulsado se vea al lado del panel (no debajo). */
function asomarCelda(el) {
  const region = el?.closest?.('.f-region')
  if (!region) return
  const r = region.getBoundingClientRect()
  const m = marco.getBoundingClientRect()
  const limiteDer = Math.min(r.right, m.right - caja.offsetWidth) - 16
  const nombre = region.querySelector('thead .c-nom')
  const limiteIzq = nombre ? nombre.getBoundingClientRect().right + 8 : r.left
  const c = el.getBoundingClientRect()
  let dx = 0
  if (c.right > limiteDer) dx = c.right - limiteDer + 40
  else if (c.left < limiteIzq && !el.closest('.c-nom')) dx = c.left - limiteIzq - 40
  // En la hoja de días, el desplazamiento cae justo en el borde de una columna de 64 px: ninguna queda a medias.
  let izquierda = region.scrollLeft + dx
  if (dx && el.closest('.c-dia, td[data-c]') && region.querySelector('thead .c-dia')) izquierda = (dx > 0 ? Math.ceil(izquierda / 64) : Math.floor(izquierda / 64)) * 64
  // La cabecera y el pie son FIJOS: su borde visible es el de sus celdas, no el del grupo de filas.
  const cab = region.querySelector('thead th')?.getBoundingClientRect().bottom ?? r.top
  const pie = Math.min(...[...region.querySelectorAll('tfoot tr > :first-child')].map((x) => x.getBoundingClientRect().top), r.bottom)
  let dy = 0
  if (c.bottom > pie) dy = c.bottom - pie + 8
  else if (c.top < cab && !el.closest('tfoot') && !el.closest('thead')) dy = c.top - cab - 8
  if (dx || dy) region.scrollTo({ left: Math.max(0, izquierda), top: region.scrollTop + dy, behavior: reducirMovimiento.matches ? 'auto' : 'smooth' })
}

function anunciar(texto) {
  const a = document.getElementById('anuncio')
  a.textContent = ''
  setTimeout(() => { a.textContent = texto }, 60)
}

let scrollAntes = null
/** Con el ratón el foco se queda en el número (la lista no es modal y se puede seguir pulsando otros); con el
 *  teclado (Enter o espacio) pasa al título de la lista. Esc la cierra y el foco vuelve al número pulsado. */
function abrirLista(clave, origen, moverFoco = false) {
  const yaAbierta = st.lista != null && !caja.hidden && !caja.classList.contains('sale')
  st.lista = clave
  st.pagina = 1
  st.origenLista = origen?.dataset?.foco ?? clave
  if (!yaAbierta) scrollAntes = document.querySelector('.f-region')?.scrollLeft ?? null
  const info = pintarLista(!yaAbierta)
  marcarAbierta()
  if (!info) return
  ajustarHueco()
  if (origen) asomarCelda(origen)
  if (moverFoco) document.getElementById('lista-titulo')?.focus({ preventScroll: true })
  anunciar(`Lista abierta: ${info.titulo}. ${info.resumen}.${info.nuevas ? ' Hay cifras nuevas.' : ''}`)
}
function cerrarLista(devolverFoco = true, animar = true) {
  if (st.lista == null) return
  const origen = st.origenLista
  st.lista = null
  st.origenLista = null
  ocultarCaja(animar)
  marcarAbierta()
  ajustarHueco()
  // La hoja vuelve a donde estaba antes de abrir la lista (el panel la había corrido para dejar ver el número).
  const region = document.querySelector('.f-region')
  if (region && scrollAntes != null) region.scrollTo({ left: scrollAntes, behavior: animar && !reducirMovimiento.matches ? 'smooth' : 'auto' })
  scrollAntes = null
  if (devolverFoco && origen) document.querySelector(`#pantalla [data-foco="${CSS.escape(origen)}"]`)?.focus({ preventScroll: !!region })
}

/** «Actualizar»: la hoja toma las cifras de ahora (nunca solo: solo cuando se pulsa). */
function actualizar() {
  const previos = new Map([...REG].map(([k, v]) => [k, v.valor]))
  versionHoja = servidor.version
  pintar()
  document.querySelectorAll('#pantalla [data-cifra]').forEach((el) => {
    const k = el.dataset.cifra
    if (previos.has(k) && REG.has(k) && previos.get(k) !== REG.get(k).valor) el.classList.add('f-recien')
  })
  document.getElementById('lista-titulo')?.focus({ preventScroll: true })
  anunciar('Cifras actualizadas: el número y la lista cuadran.')
}

function irAPagina(nueva, foco) {
  st.pagina = nueva
  pintarLista(false)
  const cuerpo = caja.querySelector('.l-cuerpo')
  if (cuerpo) cuerpo.scrollTop = 0
  // En el celular se desplaza el panel entero: vuelve a la primera tarjeta de la página, justo bajo el título fijo.
  if (caja.scrollHeight > caja.clientHeight && cuerpo) caja.scrollTop = Math.max(0, cuerpo.offsetTop - (caja.querySelector('.l-cab-fila')?.offsetHeight ?? 0) - 8)
  const el = caja.querySelector(`[data-foco="${foco}"]`)
  if (el && !el.disabled) el.focus({ preventScroll: true })
  else (caja.querySelector('[data-foco="pag-ant"]:not(:disabled), [data-foco="pag-sig"]:not(:disabled)') ?? document.getElementById('lista-mostrando'))?.focus({ preventScroll: true })
  anunciar(document.getElementById('lista-mostrando')?.textContent ?? '')
}

let chromeClave = ''
let modoActual = ''
function pintar() {
  const ancho = anchoMarco()
  const movil = ancho <= 767
  modoActual = `${movil}|${ancho <= 640}`
  const clave = `${st.rol}|${movil}`
  if (clave !== chromeClave) { app.innerHTML = htmlChrome(); chromeClave = clave }
  const pantalla = document.getElementById('pantalla')
  const region = pantalla.querySelector('.f-region')
  const sc = region ? [region.scrollLeft, region.scrollTop] : null
  const contenido = document.getElementById('contenido')
  const scC = contenido.scrollTop
  const activo = document.activeElement
  const foco = activo?.closest?.('[data-foco]')?.dataset.foco ?? null
  const focoEnLista = !!activo?.closest?.('#lista')
  REG.clear()
  pantalla.innerHTML = htmlPantalla(movil)
  pintarLista(false)
  marcarAbierta()
  ajustarHueco()
  const r2 = pantalla.querySelector('.f-region')
  if (r2 && sc) { r2.scrollLeft = sc[0]; r2.scrollTop = sc[1] }
  contenido.scrollTop = scC
  if (foco) {
    const el = document.querySelector(`[data-foco="${CSS.escape(foco)}"]`)
    if (el && !el.disabled) el.focus({ preventScroll: true })
    else if (focoEnLista) document.getElementById('lista-titulo')?.focus({ preventScroll: true })
  }
}

function cambiar(campo, valor) {
  if (campo === 'vista') {
    st.vista = valor
    pintar()
    anunciar(`${ROTULO_VISTA[valor]} · ${etiquetaPeriodo(st.gran, st.ancla)}`)
    return
  }
  if (campo === 'gran') {
    st.marcados = []
    const ultimo = diasDelPeriodo(valor, st.ancla).slice(-1)[0]
    if (ultimo > HOY && primerDiaDelMes(st.ancla) === primerDiaDelMes(HOY)) st.ancla = HOY
    if (valor === 'dia' && st.ancla > HOY) st.ancla = HOY
    st.gran = valor
  }
  if (campo === 'tipo') st.tipo = valor
  if (campo === 'equipo') st.equipo = valor
  cerrarLista(false, false)
  pintar()
  anunciar(`${mayus(etiquetaPeriodo(st.gran, st.ancla))} · ${ROTULO_VISTA[st.vista]} · ${ROTULO_TIPO_SELECT[st.tipo]}`)
}

function accion(nombre, boton) {
  if (nombre === 'anterior' || nombre === 'siguiente') {
    st.ancla = periodoDesplazado(st.gran, st.ancla, nombre === 'anterior' ? -1 : 1)
    if (st.gran === 'mes' && st.ancla > HOY) st.ancla = HOY
    st.marcados = []
    cerrarLista(false, false)
    pintar()
    anunciar(mayus(etiquetaPeriodo(st.gran, st.ancla)))
  } else if (nombre === 'restablecer') {
    st.equipo = ''; st.tipo = 'todo'; st.marcados = []
    cerrarLista(false, false); pintar()
  } else if (nombre === 'quitarMarcados') {
    st.marcados = []; pintar()
  } else if (nombre === 'filtros') {
    st.filtrosAbiertos = !st.filtrosAbiertos; pintar()
  } else if (nombre === 'cerrarLista') {
    cerrarLista(true)
  } else if (nombre === 'paginaAnterior' || nombre === 'paginaSiguiente') {
    irAPagina(st.pagina + (nombre === 'paginaSiguiente' ? 1 : -1), nombre === 'paginaSiguiente' ? 'pag-sig' : 'pag-ant')
  } else if (nombre === 'tamano') {
    st.tamano = Number(boton.dataset.valor)
    irAPagina(1, `tam-${st.tamano}`)
  } else if (nombre === 'actualizar') {
    actualizar()
  } else if (nombre === 'verAhora') {
    const el = document.querySelector('#pantalla [data-cifra="p-total"]')
    if (el) abrirLista('p-total', el, true)
  } else if (nombre === 'verOtra') {
    const clave = boton.dataset.valor
    const el = document.querySelector(`#pantalla [data-cifra="${CSS.escape(clave)}"]`)
    if (REG.has(clave)) abrirLista(clave, el, true)
  }
}

  ['celular', 'Vista celular', '390 × 844 · tarjetas'],
]
const ESCENAS = {
  normal: { rol: 'gerencia', clave: 'a|f-a01|f-sup1|2026-10-05' },
  otro: { rol: 'supervisor', clave: 'g|f-sup1|2026-10-01', claveMovil: 'd|2026-10-01' },
  cero: { rol: 'gerencia', clave: 'a|f-a10|f-sup3|2026-10-06' },
  promedio: { rol: 'gerencia', clave: 'p-prom' },
  nuevas: { rol: 'gerencia', clave: 'a|f-a07|f-sup2|2026-10-09', nuevas: true },
  celular: { rol: 'gerencia', clave: 'a|f-a01|f-sup1|2026-10-05', celular: true },
}
function pintarRevision() {
  const actual = ESTADOS.find(([v]) => v === st.estado)?.[1] ?? 'Normal'
  revision.className = st.revisionAbierta ? '' : 'plegado'
  revision.innerHTML = st.revisionAbierta
    ? `<div class="r-cab"><h2 class="r-titulo">Revisión · maqueta</h2><button type="button" class="r-plegar" data-revision="plegar" aria-expanded="true" aria-label="Plegar el panel de revisión">${icono('minus')}</button></div>
      <div class="r-lista" role="group" aria-label="Estado que se muestra">${ESTADOS.map(([v, t, sub]) => `<button type="button" class="r-estado" data-estado="${v}" aria-pressed="${st.estado === v}"><span class="r-punto" aria-hidden="true"></span><span class="r-txt"><span class="r-nombre">${t}</span><span class="r-sub">${sub}</span></span></button>`).join('')}</div>
      <p class="r-pie">Datos de ejemplo · hoy es viernes 9 oct.<br>Ves como: ${st.rol === 'supervisor' ? 'Valeria Mendoza, supervisora' : 'Gerencia'}.</p>`
    : `<button type="button" class="r-pildora" data-revision="abrir" aria-expanded="false" title="Revisión de la maqueta">${icono('sliders')}<span class="r-pildora-txt">Revisión · ${actual}</span></button>`
}
function ponerEstado(nombre) {
  const e = ESCENAS[nombre]
  if (!e) return
  st.estado = nombre
  cerrarLista(false, false)
  Object.assign(st, { rol: e.rol, gran: 'mes', ancla: HOY, vista: 'TOTAL', tipo: 'todo', equipo: '', marcados: [], cerrados: [], filtrosAbiertos: false, pagina: 1, tamano: 25 })
  versionHoja = 1
  servidor.version = 1
  st.celular = !!e.celular
  document.body.classList.toggle('celular', st.celular)
  pintar()
  const region = document.querySelector('.f-region')
  if (region) { region.scrollLeft = 0; region.scrollTop = 0 }
  document.getElementById('contenido').scrollTop = 0
  if (e.nuevas) servidor.version = 2 // alguien vende DESPUÉS de que se cargó la hoja
  const clave = esMovil() && e.claveMovil ? e.claveMovil : e.clave
  const el = document.querySelector(`#pantalla [data-cifra="${CSS.escape(clave)}"]`)
  if (REG.has(clave)) abrirLista(clave, el, false)
  pintarRevision()
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button')
  if (!t || t.disabled) return
  if (t.dataset.estado) { ponerEstado(t.dataset.estado); revision.querySelector(`[data-estado="${t.dataset.estado}"]`)?.focus({ preventScroll: true }); return }
  if (t.dataset.revision) { st.revisionAbierta = t.dataset.revision === 'abrir'; pintarRevision(); revision.querySelector('button')?.focus(); return }
  if (t.dataset.cifra) { abrirLista(t.dataset.cifra, t, e.detail === 0); return }
  if (t.dataset.campo) { cambiar(t.dataset.campo, t.dataset.valor); return }
  if (t.dataset.dia) {
    const d = t.dataset.dia
    st.marcados = st.marcados.includes(d) ? st.marcados.filter((x) => x !== d) : [...st.marcados, d].sort()
    pintar()
    anunciar(st.marcados.length ? `${st.marcados.length} ${st.marcados.length === 1 ? 'día elegido' : 'días elegidos'}` : 'Sin días elegidos')
    return
  }
  if (t.dataset.banda) {
    const s = t.dataset.banda
    st.cerrados = st.cerrados.includes(s) ? st.cerrados.filter((x) => x !== s) : [...st.cerrados, s]
    pintar()
    return
  }
  if (t.dataset.accion) accion(t.dataset.accion, t)
})
document.addEventListener('change', (e) => { const s = e.target.closest('select[data-campo]'); if (s) cambiar(s.dataset.campo, s.value) })
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.lista != null) { e.preventDefault(); cerrarLista(true) } })

// El cursor ilumina su fila y su columna en la hoja, y la pastilla bajo el cursor brilla donde está el ratón.
let cruzActual = { fila: null, col: null }
function pintarCruz(fila, col) {
  if (cruzActual.fila && cruzActual.fila !== fila) cruzActual.fila.classList.remove('cruz')
  if (fila && fila !== cruzActual.fila) fila.classList.add('cruz')
  if (col !== cruzActual.col) {
    let estilo = document.getElementById('estilo-cruz')
    if (!estilo) { estilo = document.createElement('style'); estilo.id = 'estilo-cruz'; document.head.appendChild(estilo) }
    estilo.textContent = col == null ? '' : `
      .f-hoja tbody [data-c="${col}"], .f-hoja tfoot [data-c="${col}"] { background-color: var(--cruz); }
      .f-hoja thead [data-c="${col}"]:not(.marcado), .f-hoja tbody tr.banda > [data-c="${col}"] { background-color: var(--cruz-fuerte); }
      .f-hoja thead [data-c="${col}"]:not(.marcado) .f-dia-num { color: var(--accent-press); }`
  }
  cruzActual = { fila, col }
}
document.addEventListener('pointermove', (e) => {
  const p = e.target.closest?.('.f-pastilla')
  if (p) {
    const r = p.getBoundingClientRect()
    p.style.setProperty('--mx', `${e.clientX - r.left}px`)
    p.style.setProperty('--my', `${e.clientY - r.top}px`)
  }
  const celdaH = e.target.closest?.('.f-hoja th, .f-hoja td')
  if (!celdaH) return pintarCruz(null, null)
  const tr = celdaH.parentElement
  pintarCruz(tr.closest('tbody') ? tr : null, celdaH.dataset.c ?? null)
})
document.addEventListener('pointerleave', () => pintarCruz(null, null))

// El ancho del MARCO decide el modo (teléfono, celular): al cruzar un corte se vuelve a pintar.
new ResizeObserver(() => {
  const ancho = anchoMarco()
  const modo = `${ancho <= 767}|${ancho <= 640}`
  if (modo !== modoActual) pintar()
  else ajustarHueco()
}).observe(marco)

/** Medidas REALES (para la verificación): letra, nombres, contraste, encabezados con scope, botones. */
function medir() {
  const rgb = (c) => { const m = c.match(/rgba?\(([^)]+)\)/); if (!m) return [255, 255, 255, 0]; const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p[3] ?? 1] }
  const lum = ([r, g, b]) => { const c = [r, g, b].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4 }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] }
  const fondo = (el) => {
    const capas = []
    for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
      const c = rgb(getComputedStyle(n).backgroundColor)
      if (c[3] > 0) capas.push(c)
      if (c[3] >= 1) break
    }
    let base = [255, 255, 255]
    for (let i = capas.length - 1; i >= 0; i -= 1) { const [r, g, b, al] = capas[i]; base = [r * al + base[0] * (1 - al), g * al + base[1] * (1 - al), b * al + base[2] * (1 - al)] }
    return base
  }
  const contraste = (a, b) => { const x = lum(a); const y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05) }
  const zonas = [document.getElementById('pantalla'), caja].filter((z) => z && !z.hidden)
  let letraMin = Infinity
  let letraMinTxt = ''
  let contrasteMin = Infinity
  let contrasteTxt = ''
  for (const z of zonas) {
    for (const el of z.querySelectorAll('*')) {
      const propio = [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())
      if (!propio || el.closest('.sr-only')) continue
      const r = el.getBoundingClientRect()
      if (r.width === 0 || r.height === 0) continue
      const cs = getComputedStyle(el)
      if (cs.visibility === 'hidden') continue
      const fs = parseFloat(cs.fontSize)
      if (fs < letraMin) { letraMin = fs; letraMinTxt = el.textContent.trim().slice(0, 40) }
      const c = contraste(rgb(cs.color), fondo(el))
      if (c < contrasteMin) { contrasteMin = c; contrasteTxt = el.textContent.trim().slice(0, 40) }
    }
  }
  const nombres = zonas.flatMap((z) => [...z.querySelectorAll('[data-nombre]')]).filter((el) => el.getBoundingClientRect().width > 0)
  const thTodos = zonas.flatMap((z) => [...z.querySelectorAll('th')])
  return {
    ancho: anchoMarco(),
    anchoPanel: caja.hidden ? 0 : caja.offsetWidth,
    letraMin: Number.isFinite(letraMin) ? letraMin : null,
    letraMinTxt,
    nombresMin: nombres.length ? Math.min(...nombres.map((el) => parseFloat(getComputedStyle(el).fontSize))) : null,
    contrasteMin: Number.isFinite(contrasteMin) ? Math.round(contrasteMin * 100) / 100 : null,
    contrasteTxt,
    thConScope: thTodos.filter((t) => t.hasAttribute('scope')).length,
    thSinScope: thTodos.filter((t) => !t.hasAttribute('scope')).length,
    cifras: document.querySelectorAll('#pantalla [data-cifra]').length,
    cifrasSinEtiqueta: [...document.querySelectorAll('#pantalla [data-cifra]')].filter((b) => b.tagName !== 'BUTTON' || !(b.getAttribute('aria-label') || b.textContent.trim())).length,
    paginaScrollLateral: document.documentElement.scrollWidth > window.innerWidth + 1,
  }
}

/** Oráculo de la pieza: para CADA número de la pantalla, recorre todas las páginas de su lista (de 100 en 100) y exige
 *  que sume exactamente el número, que `n` sea 1..total, que `totales` cuadre por moneda y que las filas ocultas
 *  lleven solo las claves permitidas (ni un id). */
function verificarTodas() {
  const PERMITIDAS = ['n', 'fecha', 'tipo', 'moneda', 'monto', 'anulado', 'analista_id', 'analista_nombre', 'supervisor_id', 'supervisor_nombre', 'visible', 'cliente_nombre'].sort().join(',')
  const fallos = []
  let revisadas = 0
  let ocultas = 0
  for (const [clave, spec] of REG) {
    revisadas += 1
    const filas = []
    let resp
    for (let pagina = 1; ; pagina += 1) {
      resp = servidor.listar(paramsDe(spec, pagina, 100))
      filas.push(...resp.filas)
      if (filas.length >= resp.total || resp.filas.length === 0) break
    }
    const vistaL = spec.ambas ? 'TOTAL' : st.vista
    const pen = filas.filter((f) => f.moneda === 'PEN').reduce((s, f) => s + f.monto, 0)
    const usd = filas.filter((f) => f.moneda === 'USD').reduce((s, f) => s + f.monto, 0)
    const mil = vistaL === 'TOTAL' ? pen * 1000 + usd * TASA_MIL : vistaL === 'PEN' ? pen * 1000 : usd * 1000
    const motivos = []
    if (spec.modo === 'conteo' ? filas.length !== spec.valor
      : spec.modo === 'promedio' ? Math.round(mil / 1000 / spec.habiles) * 1000 !== spec.valor
        : spec.modo === 'comparacion' ? mil !== spec.comp.antes
          : mil !== spec.valor) motivos.push('no suma el número')
    if (filas.length !== resp.total) motivos.push('filas ≠ total')
    if (!filas.every((f, i) => f.n === i + 1)) motivos.push('n con huecos')
    if ((resp.totales.find((t) => t.moneda === 'PEN')?.monto ?? 0) !== pen || (resp.totales.find((t) => t.moneda === 'USD')?.monto ?? 0) !== usd) motivos.push('totales')
    for (const f of filas) {
      if (f.visible) continue
      ocultas += 1
      if (Object.keys(f).sort().join(',') !== PERMITIDAS) motivos.push('fila oculta con claves de más')
    }
    if (st.rol === 'gerencia' && filas.some((f) => !f.visible)) motivos.push('Gerencia con filas ocultas')
    if (motivos.length) fallos.push({ clave, motivos })
  }
  return { revisadas, ocultas, fallos }
}

// Para comprobarla desde fuera (pruebas de la pieza).
window.__pieza = { st, REG, servidor, ponerEstado, abrirLista, cerrarLista, medir, verificarTodas, paramsDe, respuesta: () => ultimaRespuesta, versionHoja: () => versionHoja }

st.revisionAbierta = params.get('revision') !== '0' && window.innerWidth > 640
pintarRevision()
ponerEstado(ESCENAS[params.get('estado')] ? params.get('estado') : 'normal')
</script>
