    <button type="button" class="f-icono f-restablecer" data-accion="restablecer" data-foco="restablecer" aria-label="Restablecer filtros" title="Restablecer filtros"${filtrosVacios ? ' disabled' : ''}>${icono('rotate')}</button>
  </div>`
}

function pastilla(clave, spec, valor, etiqueta, texto, pista, titulo = '') {
  if (valor === 0 || clave == null) return `<p class="f-pastilla"><span>${esc(etiqueta)}<span class="sr-only">:</span></span><strong>${esc(texto)}</strong></p>`
  registrar(clave, spec, valor)
  return `<button type="button" class="f-pastilla" data-cifra="${clave}" data-valor="${valor}" data-foco="${clave}"${titulo ? ` title="${esc(titulo)}"` : ''}><span>${esc(etiqueta)}<span class="sr-only">:</span></span><strong>${esc(texto)}</strong><span class="sr-only">, ${esc(pista)}</span></button>`
}

/** E1: las cuatro cifras de arriba como una fila de pastillas. Cada una abre su lista (§3 del plan). */
function htmlPastillas(ctx) {
  const m = ctx.malla
  const total = vm(m.total)
  const n = vn(m.total)
  const hayUsd = m.total.nUsd > 0
  const rotulo = st.vista === 'TOTAL' ? (hayUsd ? 'Total facturado' : 'Facturado') : st.vista === 'PEN' ? (hayUsd ? 'Facturado en soles' : 'Facturado') : 'Facturado en dólares'
  const ceja = alcanceTexto()
  const titulo = tituloTramo(ctx)
  const pTotal = pastilla('p-total', { titulo, ceja, dias: ctx.T, modo: 'suma', queEs: rotulo }, total, rotulo, dinero(total), `ver sus ${n} operaciones`)
  const comp = comparacion(ctx)
  const pVs = comp.nula
    ? `<p class="f-pastilla" title="${ctx.marcados.length ? 'Con días sueltos elegidos a mano no hay un tramo anterior que signifique lo mismo' : 'El tramo anterior no tiene ventas con las que comparar'}"><span>${esc(comp.nula)}</span></p>`
    : pastilla('p-vs', { titulo: `La cifra de antes: ${comp.periodo}`, ceja, dias: comp.recorte, modo: 'comparacion', comp }, comp.antes, comp.rotulo, comp.texto, `comparado con ${comp.periodo}: ver esas operaciones`, `Comparado con ${comp.periodo}`)
  const etiquetaN = st.tipo === 'todo' ? 'Contratos cerrados' : `Contratos · ${ROTULO_TIPO_SELECT[st.tipo]}`
  const pN = pastilla('p-n', { titulo, ceja, dias: ctx.T, modo: 'conteo', queEs: etiquetaN }, n, etiquetaN, nf(n, 0), 'ver la lista')
  let html = `<div class="f-doble">${pTotal}${pVs}</div>${pN}`
  if (st.gran !== 'dia') {
    let mejor = null
    for (const d of ctx.T) { const a = m.cols.get(d); const v = a ? vm(a) : 0; if (v > 0 && (!mejor || v > mejor.v)) mejor = { d, v } }
    html += mejor
      ? pastilla('p-mejor', { titulo: mayus(diaLargo(mejor.d)), ceja, dias: [mejor.d], modo: 'suma', queEs: 'Mejor día' }, mejor.v, `Mejor día · ${diaMedioCorto(mejor.d)}`, dinero(mejor.v), `ver las operaciones del ${diaLargo(mejor.d)}`)
      : '<p class="f-pastilla"><span>Mejor día</span><strong>—</strong></p>'
    const habiles = ctx.T.filter((d) => d <= HOY && diaSemana(d) !== 0).length
    const promedio = habiles ? Math.round(total / 1000 / habiles) * 1000 : 0
    html += habiles
      ? pastilla('p-prom', { titulo, ceja, dias: ctx.T, modo: 'promedio', habiles, queEs: 'Promedio por día hábil' }, promedio, 'Promedio por día hábil', dinero(promedio), `ver las operaciones de los ${habiles} días hábiles`)
      : '<p class="f-pastilla"><span>Promedio por día hábil</span><strong>—</strong></p>'
  }
  return `<section class="f-pastillas" aria-label="Resumen de lo que estás viendo">${html}</section>`
}

/** Una cifra de la hoja: botón con la escala de color; un cero es un punto y no se abre. */
function celda({ clave, spec, a, max, etiqueta, col, clases = '', exacta = false }) {
  const mil = a ? vm(a) : 0
  if (mil === 0) return `<td class="f-c ${clases}" data-c="${col}"><span class="f-cifra f-cero" aria-hidden="true">·</span><span class="sr-only">sin ventas</span></td>`
  const p = paso(mil, max)
  registrar(clave, spec, mil)
  const texto = dinero(mil)
  return `<td class="f-c ${clases}" data-c="${col}"><button type="button" class="f-cifra" data-cifra="${esc(clave)}" data-valor="${mil}" data-foco="${esc(clave)}" style="background:${p.bg};color:${p.fg}" title="${esc(etiqueta)}: ${texto}" aria-label="${esc(etiqueta)}: ${texto}, ${verOps(vn(a))}">${exacta ? texto : compacta(mil)}</button></td>`
}
function celdaTotal({ clave, spec, a, etiqueta, clases = '' }) {
  const mil = vm(a)
  if (mil === 0) return `<td class="c-tot ${clases}"><span class="f-tot f-cero">${dinero(0)}</span></td>`
  registrar(clave, spec, mil)
  const texto = dinero(mil)
  return `<td class="c-tot ${clases}"><button type="button" class="f-tot" data-cifra="${esc(clave)}" data-valor="${mil}" data-foco="${esc(clave)}" aria-label="${esc(etiqueta)}: ${texto}, ${verOps(vn(a))}">${texto}</button></td>`
}
function celdaPie({ clave, spec, a, max, etiqueta, col, clases = '', unificada = false, exacta = false }) {
  const mil = a ? (unificada ? vm(a, 'TOTAL') : vm(a)) : 0
  const vista = unificada ? 'TOTAL' : st.vista
  if (mil === 0) return `<td class="f-c ${clases}" data-c="${col}"><span class="f-pie-cifra${unificada ? ' f-pie2-cifra' : ''}"><span class="f-cero" aria-hidden="true">·</span>${unificada ? '' : '<span class="f-pie-barra cero" style="height:2px" aria-hidden="true"></span>'}<span class="sr-only">sin ventas</span></span></td>`
  registrar(clave, spec, mil)
  const texto = dinero(mil, vista)
  const alto = max > 0 ? Math.max(3, Math.round((mil / max) * 22)) : 2
  return `<td class="f-c ${clases}" data-c="${col}"><button type="button" class="f-pie-cifra${unificada ? ' f-pie2-cifra' : ''}" data-cifra="${esc(clave)}" data-valor="${mil}" data-foco="${esc(clave)}" title="${esc(etiqueta)}: ${texto}" aria-label="${esc(etiqueta)}: ${texto}, ${verOps(vn(a, vista))}"><span>${exacta ? texto : compacta(mil)}</span>${unificada ? '' : `<span class="f-pie-barra" style="height:${alto}px" aria-hidden="true"></span>`}</button></td>`
}
const clasesDia = (d) => [esFinde(d) ? 'finde' : '', d === HOY ? 'es-hoy' : ''].filter(Boolean).join(' ')

function celdaNombre(f, ctx, specTotal, mil, nombreTramo) {
  const sub = subtituloDe(f, ctx)
  const subHtml = sub ? `<span class="f-sub">${esc(sub)}</span>` : ''
  const titulo = `${f.nombre}${sub ? ` · ${sub}` : ''}`
  if (mil === 0) return `<div class="f-nom-txt" title="${esc(titulo)}"><span class="f-nombre" data-nombre>${esc(f.nombre)}</span>${subHtml}</div>`
  const clave = registrar(`aN|${f.aid}|${f.sid}`, specTotal, mil)
  return `<button type="button" class="f-nom-btn" data-cifra="${clave}" data-valor="${mil}" data-foco="${clave}" title="${esc(titulo)}" aria-label="Ver ${esc(nombreTramo)} de ${esc(f.nombre)}${sub ? ` (${esc(sub)})` : ''}: ${dinero(mil)}"><span class="f-nombre" data-nombre>${esc(f.nombre)}</span>${subHtml}</button>`
}

/** E2–E4: la hoja de Mes y Semana. */
function htmlHojaDias(ctx) {
  const m = ctx.malla
  const cols = ctx.pasados
  const conPv = ctx.futuros.length > 0 && st.diasPorVenir === 'plegados'
  const marc = new Set(ctx.marcados)
  const nombreTramo = ctx.marcados.length ? 'lo de los días elegidos' : st.gran === 'mes' ? 'el mes' : 'la semana'
  const etiquetaTotal = ctx.marcados.length ? 'Total elegido' : st.gran === 'mes' ? 'Total del mes' : 'Total de la semana'
  const tTramo = tituloTramo(ctx)
  const pista = ctx.marcados.length === 0 ? ' f-pista' : ''
  const cab = `<tr>
    <th scope="col" class="c-num"><span aria-hidden="true">#</span><span class="sr-only">Número de fila</span></th>
    <th scope="col" class="c-nom"><span class="f-cab-txt">${st.rol === 'supervisor' ? 'Analista' : 'Equipo y analista'}</span></th>
    ${cols.map((d, i) => {
      const es = marc.has(d)
      return `<th scope="col" class="c-dia ${clasesDia(d)}${es ? ' marcado' : ''}" data-c="${i}"><button type="button" class="f-dia-btn${pista}" data-dia="${d}" data-foco="dia-${d}" aria-pressed="${es}" aria-label="${es ? 'Quitar' : 'Elegir'} el ${diaLargo(d)}" title="${es ? 'Quitar este día' : 'Elegir este día'}"><span class="f-dia-num">${numeroDia(d)}</span><span class="f-dia-letra">${LETRAS[diaSemana(d)]}</span><span class="f-dia-punto" aria-hidden="true"></span></button></th>`
    }).join('')}
    ${conPv ? `<th scope="col" class="c-pv"><span class="f-pv-cab" title="Del ${numeroDia(ctx.futuros[0])} al ${numeroDia(ctx.futuros[ctx.futuros.length - 1])}: aún no pasan"><b>${etiquetaPorVenir(ctx.futuros)}</b><span>por venir</span></span></th>` : ''}
    <th scope="col" class="c-tot"><span class="f-cab-txt" style="text-align:right">${etiquetaTotal}</span></th>
  </tr>`
  let num = 0
  const cuerpo = m.grupos.map((g) => {
    const abierto = !st.cerrados.includes(g.sid)
    const cejaG = `Equipo de ${g.nombre}`
    const banda = `<tr class="banda">
      <td class="c-num"></td>
      <th scope="row" class="c-nom"><button type="button" class="f-banda-btn" data-banda="${g.sid}" data-foco="banda-${g.sid}" aria-expanded="${abierto}" title="${abierto ? 'Plegar' : 'Desplegar'} el equipo">${icono('chevronRight')}<span class="f-banda-nombre" data-nombre>${esc(g.nombre)}</span><span class="f-banda-n">${g.filas.length} ${g.filas.length === 1 ? 'analista' : 'analistas'}</span></button></th>
      ${cols.map((d, i) => celda({ clave: `g|${g.sid}|${d}`, spec: { titulo: mayus(diaLargo(d)), ceja: cejaG, dias: [d], sid: g.sid, modo: 'suma' }, a: g.cols.get(d), max: m.maxG, etiqueta: `${cejaG}, ${diaLargo(d)}`, col: i, clases: clasesDia(d) })).join('')}
      ${conPv ? '<td class="c-pv"></td>' : ''}
      ${celdaTotal({ clave: `gT|${g.sid}`, spec: { titulo: tTramo, ceja: cejaG, dias: ctx.T, sid: g.sid, modo: 'suma' }, a: g.total, etiqueta: `${etiquetaTotal} del ${minusInicial(cejaG)}` })}
    </tr>`
    const filas = g.filas.map((f) => {
      num += 1
      if (!abierto) return ''
      const ceja = cejaPersona(f)
      const specTotal = { titulo: tTramo, ceja, dias: ctx.T, aid: f.aid, sid: f.sid, modo: 'suma' }
      const mil = vm(f.total)
      return `<tr class="fila">
        <td class="c-num">${num}</td>
        <th scope="row" class="c-nom">${celdaNombre(f, ctx, specTotal, mil, nombreTramo)}</th>
        ${cols.map((d, i) => celda({ clave: `a|${f.aid}|${f.sid}|${d}`, spec: { titulo: mayus(diaLargo(d)), ceja, dias: [d], aid: f.aid, sid: f.sid, modo: 'suma' }, a: f.cols.get(d), max: m.maxA, etiqueta: `${f.nombre}, ${diaLargo(d)}`, col: i, clases: clasesDia(d) })).join('')}
        ${conPv ? '<td class="c-pv"></td>' : ''}
        ${celdaTotal({ clave: `aT|${f.aid}|${f.sid}`, spec: specTotal, a: f.total, etiqueta: `${etiquetaTotal} de ${f.nombre}` })}
      </tr>`
    }).join('')
    return banda + filas
  }).join('')
  const etiquetaPie = st.rol === 'supervisor' ? 'Total de tu equipo' : st.equipo || st.tipo !== 'todo' ? 'Total de lo que estás viendo' : 'Total de la empresa'
  const ceja = alcanceTexto()
  const conPie2 = st.vista !== 'TOTAL' && m.total.nUsd > 0
  let maxC2 = 0
  if (conPie2) for (const a of m.cols.values()) maxC2 = Math.max(maxC2, vm(a, 'TOTAL'))
  const pie1 = `<tr class="pie1" style="--b1:${conPie2 ? '52px' : '0px'}">
    <td class="c-num"></td>
    <th scope="row" class="c-nom"><span class="f-pie-nombre">${etiquetaPie}</span></th>
    ${cols.map((d, i) => celdaPie({ clave: `d|${d}`, spec: { titulo: mayus(diaLargo(d)), ceja, dias: [d], modo: 'suma' }, a: m.cols.get(d), max: m.maxC, etiqueta: `${etiquetaPie}, ${diaLargo(d)}`, col: i, clases: clasesDia(d) })).join('')}
    ${conPv ? '<td class="c-pv"></td>' : ''}
    ${celdaTotal({ clave: 'T', spec: { titulo: tTramo, ceja, dias: ctx.T, modo: 'suma' }, a: m.total, etiqueta: etiquetaPie })}
  </tr>`
  const pie2 = conPie2 ? `<tr class="pie2">
    <td class="c-num"></td>
    <th scope="row" class="c-nom"><span class="f-pie-nombre">Total del día en soles<span class="f-pie-sub">dólares a S/ ${TASA_TXT}</span></span></th>
    ${cols.map((d, i) => celdaPie({ clave: `dC|${d}`, spec: { titulo: mayus(diaLargo(d)), ceja, dias: [d], modo: 'suma', ambas: true }, a: m.cols.get(d), max: maxC2, etiqueta: `Total del día en soles, ${diaLargo(d)}`, col: i, clases: clasesDia(d), unificada: true })).join('')}
    ${conPv ? '<td class="c-pv"></td>' : ''}
    ${(() => { const mil = vm(m.total, 'TOTAL'); registrar('TC', { titulo: tTramo, ceja, dias: ctx.T, modo: 'suma', ambas: true }, mil); return `<td class="c-tot"><button type="button" class="f-tot" data-cifra="TC" data-valor="${mil}" data-foco="TC" aria-label="Total en soles: ${dinero(mil, 'TOTAL')}, ${verOps(vn(m.total, 'TOTAL'))}">${dinero(mil, 'TOTAL')}</button></td>` })()}
  </tr>` : ''
  return `<table class="f-hoja llena${conPv ? '' : ' sin-pv'}">
    <caption class="sr-only">Facturación por día ·${esc(etiquetaPeriodo(st.gran, st.ancla))} · ${ROTULO_VISTA[st.vista]} · ${ROTULO_TIPO_SELECT[st.tipo]}. Pulsa cualquier cifra para ver las operaciones que la forman; pulsa el número de un día para elegirlo.</caption>
    <thead>${cab}</thead><tbody>${cuerpo}</tbody><tfoot>${pie1}${pie2}</tfoot>
  </table>`
}

/** E5 · La vista Día por tipo (decisión 2, opción A). */
function htmlHojaDiaTipos(ctx) {
  const dia = ctx.pasados[0]
  const cols = st.tipo === 'todo' ? TIPOS : [st.tipo]
  const m = agrupar(ctx.opsRoster, ctx.ops, (o) => o.tipo, () => true)
  const tDia = mayus(diaLargo(dia))
  const cab = `<tr>
    <th scope="col" class="c-num"><span aria-hidden="true">#</span><span class="sr-only">Número de fila</span></th>
    <th scope="col" class="c-nom"><span class="f-cab-txt">${st.rol === 'supervisor' ? 'Analista' : 'Equipo y analista'}</span></th>
    ${cols.map((t, i) => `<th scope="col" class="c-tipo" data-c="${i}"><span class="f-cab-txt" style="text-align:center">${ROTULO_TIPO[t]}</span></th>`).join('')}
    <th scope="col" class="c-tot"><span class="f-cab-txt" style="text-align:right">Total del día</span></th>
  </tr>`
  let num = 0
  const cuerpo = m.grupos.map((g) => {
    const abierto = !st.cerrados.includes(g.sid)
    const cejaG = `Equipo de ${g.nombre}`
    const banda = `<tr class="banda">
      <td class="c-num"></td>
      <th scope="row" class="c-nom"><button type="button" class="f-banda-btn" data-banda="${g.sid}" data-foco="banda-${g.sid}" aria-expanded="${abierto}">${icono('chevronRight')}<span class="f-banda-nombre" data-nombre>${esc(g.nombre)}</span><span class="f-banda-n">${g.filas.length} ${g.filas.length === 1 ? 'analista' : 'analistas'}</span></button></th>
      ${cols.map((t, i) => celda({ clave: `tg|${g.sid}|${t}`, spec: { titulo: `${tDia} · ${ROTULO_TIPO[t]}`, ceja: cejaG, dias: [dia], sid: g.sid, tipo: t, modo: 'suma' }, a: g.cols.get(t), max: m.maxG, etiqueta: `${cejaG}, ${ROTULO_TIPO[t]}`, col: i, exacta: true })).join('')}
      ${celdaTotal({ clave: `gT|${g.sid}`, spec: { titulo: tDia, ceja: cejaG, dias: [dia], sid: g.sid, modo: 'suma' }, a: g.total, etiqueta: `Total del día del ${minusInicial(cejaG)}` })}
    </tr>`
    const filas = g.filas.map((f) => {
      num += 1
      if (!abierto) return ''
      const ceja = cejaPersona(f)
      const specTotal = { titulo: tDia, ceja, dias: [dia], aid: f.aid, sid: f.sid, modo: 'suma' }
      const mil = vm(f.total)
      return `<tr class="fila">
        <td class="c-num">${num}</td>
        <th scope="row" class="c-nom">${celdaNombre(f, ctx, specTotal, mil, 'el día')}</th>
        ${cols.map((t, i) => celda({ clave: `t|${f.aid}|${f.sid}|${t}`, spec: { titulo: `${tDia} · ${ROTULO_TIPO[t]}`, ceja, dias: [dia], aid: f.aid, sid: f.sid, tipo: t, modo: 'suma' }, a: f.cols.get(t), max: m.maxA, etiqueta: `${f.nombre}, ${ROTULO_TIPO[t]}`, col: i, exacta: true })).join('')}
        ${celdaTotal({ clave: `aT|${f.aid}|${f.sid}`, spec: specTotal, a: f.total, etiqueta: `Total del día de ${f.nombre}` })}
      </tr>`
    }).join('')
    return banda + filas
  }).join('')
  const etiquetaPie = st.rol === 'supervisor' ? 'Total de tu equipo' : st.equipo || st.tipo !== 'todo' ? 'Total de lo que estás viendo' : 'Total de la empresa'
  const ceja = alcanceTexto()
  const pie = `<tr class="pie1">
    <td class="c-num"></td>
    <th scope="row" class="c-nom"><span class="f-pie-nombre">${etiquetaPie}</span></th>
    ${cols.map((t, i) => celdaPie({ clave: `tp|${t}`, spec: { titulo: `${tDia} · ${ROTULO_TIPO[t]}`, ceja, dias: [dia], tipo: t, modo: 'suma' }, a: m.cols.get(t), max: m.maxC, etiqueta: `${etiquetaPie}, ${ROTULO_TIPO[t]}`, col: i, exacta: true })).join('')}
    ${celdaTotal({ clave: 'T', spec: { titulo: tDia, ceja, dias: [dia], modo: 'suma' }, a: m.total, etiqueta: etiquetaPie })}
  </tr>`
  return `<table class="f-hoja f-hoja-ancha">
    <caption class="sr-only">Facturación del ${diaLargo(dia)} por tipo · ${ROTULO_VISTA[st.vista]}. Pulsa cualquier cifra para ver sus operaciones.</caption>
    <thead>${cab}</thead><tbody>${cuerpo}</tbody><tfoot>${pie}</tfoot>
  </table>`
}

const ordenLista = (a, b) => a.dia.localeCompare(b.dia) || (a.moneda === b.moneda ? 0 : a.moneda === 'PEN' ? -1 : 1) || b.capital - a.capital || a.id.localeCompare(b.id)
const clienteOculto = (o) => st.rol === 'supervisor' && st.clienteAjeno === 'oculto' && o.otroEquipo
const htmlCliente = (o) => (clienteOculto(o)
  ? `<span class="f-ajeno" title="El cliente ya es de otro equipo: se muestra el importe, no el nombre">${icono('eyeOff')}Cliente de otro equipo</span>`
  : `<span class="l-cli-nom" data-nombre title="${esc(o.cliente)}">${esc(o.cliente)}</span>`)
const htmlAnulada = (o) => (o.anulada ? '<span class="f-anulada" title="Anulada: aparece y cuenta igual (la anulación no descuenta el capital)">Anulada · cuenta igual</span>' : '')
const htmlTipo = (o) => `<span class="f-tipo ${CLASE_TIPO[o.tipo]}"${o.tipo === 'contrato_nuevo' ? ' title="Capital nuevo"' : ''}>${ROTULO_TIPO[o.tipo]}</span>`

/** La vista Día como lista de operaciones (decisión 2, opción B). */
function htmlHojaDiaLista(ctx) {
  const dia = ctx.pasados[0]
  const ops = ctx.ops.filter((o) => st.vista === 'TOTAL' || o.moneda === st.vista)
  const porEquipo = new Map()
  for (const o of ops) { if (!porEquipo.has(o.supervisorId)) porEquipo.set(o.supervisorId, []); porEquipo.get(o.supervisorId).push(o) }
  const grupos = [...porEquipo.entries()].map(([sid, l]) => ({ sid, ops: l.sort((a, b) => ORDEN_A[a.analistaId] - ORDEN_A[b.analistaId] || b.capital - a.capital), a: l.reduce(sumar, vacio()) }))
    .sort((x, y) => vm(y.a) - vm(x.a))
  const tDia = mayus(diaLargo(dia))
  let num = 0
  const cuerpo = grupos.map((g) => {
    const cejaG = `Equipo de ${NOMBRE_SUP[g.sid]}`
    return `<tbody>
      <tr class="banda">
        <td class="c-num"></td>
        <th scope="rowgroup" class="c-nom"><span class="f-banda-txt"><span class="f-banda-nombre" data-nombre>${esc(NOMBRE_SUP[g.sid])}</span></span></th>
        <td colspan="4" class="l-dato"><span class="f-banda-n">${operaciones(g.ops.length)}</span></td>
        ${celdaTotal({ clave: `gT|${g.sid}`, spec: { titulo: tDia, ceja: cejaG, dias: [dia], sid: g.sid, modo: 'suma' }, a: g.a, etiqueta: `Total del día del ${minusInicial(cejaG)}` })}
      </tr>
      ${g.ops.map((o) => { num += 1; return `<tr class="fila">
        <td class="c-num">${num}</td>
        <th scope="row" class="c-nom"><span class="l-cli-in">${htmlCliente(o)}${htmlAnulada(o)}</span></th>
        <td class="l-dato tab">${clienteOculto(o) ? '—' : o.numero}</td>
        <td class="l-dato">${htmlTipo(o)}</td>
        <td class="l-dato-nombre" data-nombre>${esc(o.analistaNombre)}</td>
        <td class="l-dato">${o.moneda === 'PEN' ? 'Soles' : 'Dólares'}</td>
        <td class="c-tot"><span class="f-tot">${money(o.capital, o.moneda)}</span></td>
      </tr>` }).join('')}
    </tbody>`
  }).join('')
  const a = ops.reduce(sumar, vacio())
  const etiquetaPie = st.rol === 'supervisor' ? 'Total de tu equipo' : 'Total del día'
  const vacia = ops.length === 0 ? '<tbody><tr><td class="c-num"></td><td colspan="6" class="l-dato" style="height:64px">Todavía no hay cierres este día.</td></tr></tbody>' : ''
  return `<table class="f-hoja f-hoja-ancha">
    <caption class="sr-only">Operaciones del ${diaLargo(dia)} · ${ROTULO_VISTA[st.vista]}.</caption>
    <thead><tr>
      <th scope="col" class="c-num"><span aria-hidden="true">#</span><span class="sr-only">Número de fila</span></th>
      <th scope="col" class="c-nom"><span class="f-cab-txt">Cliente</span></th>
      <th scope="col"><span class="f-cab-txt">N.º</span></th>
      <th scope="col"><span class="f-cab-txt">Tipo</span></th>
      <th scope="col"><span class="f-cab-txt">Analista</span></th>
      <th scope="col"><span class="f-cab-txt">Moneda</span></th>
      <th scope="col" class="c-tot"><span class="f-cab-txt" style="text-align:right">Monto</span></th>
    </tr></thead>
    ${cuerpo}${vacia}
    <tfoot><tr class="pie1">
      <td class="c-num"></td>
      <th scope="row" class="c-nom"><span class="f-pie-nombre">${etiquetaPie}</span></th>
      <td colspan="4" class="l-dato">${st.vista === 'TOTAL' && a.nUsd > 0 ? `${money(a.pen, 'PEN')} + ${money(a.usd, 'USD')} × ${TASA_TXT}` : operaciones(ops.length)}</td>
      ${celdaTotal({ clave: 'T', spec: { titulo: tDia, ceja: alcanceTexto(), dias: [dia], modo: 'suma' }, a, etiqueta: etiquetaPie })}
    </tr></tfoot>
  </table>`
}

function htmlMalla(ctx) {
  const m = ctx.malla
  const personas = new Set(m.grupos.flatMap((g) => g.filas.map((f) => f.aid))).size
  const equipos = m.grupos.length
  let titulo
  if (st.gran === 'dia') titulo = st.vistaDia === 'tipos' ? 'Ese día, por tipo: por equipo y por analista' : 'Ese día, operación por operación'
  else titulo = st.gran === 'semana' ? 'Esa semana, día a día, por equipo y por analista' : 'Cada día del mes, por equipo y por analista'
  if (st.vista === 'TOTAL' && !(st.gran === 'dia' && st.vistaDia === 'lista')) titulo += ' · soles y dólares convertidos'
  const hayUsd = m.total.nUsd > 0
  const moneda = st.vista === 'TOTAL'
    ? `Los dólares se suman convertidos al ${ROTULO_TASA}.`
    : st.vista === 'PEN'
      ? `Solo soles: aquí los dólares nunca se suman.${hayUsd && st.gran !== 'dia' ? ` La fila de abajo, «Total del día en soles», los suma al ${ROTULO_TASA}.` : ''}`
      : `Solo dólares.${hayUsd && st.gran !== 'dia' ? ` La fila de abajo, «Total del día en soles», los suma con los soles al ${ROTULO_TASA}.` : ''}`
  const ocultos = st.gran !== 'dia' && ctx.futuros.length && st.diasPorVenir === 'ocultos'
    ? ` Del ${numeroDia(ctx.futuros[0])} al ${numeroDia(ctx.futuros[ctx.futuros.length - 1])} de ${MESES[indiceMes(ctx.futuros[0])]} aún no pasan: no se muestran.` : ''
  const como = st.gran === 'dia' && st.vistaDia === 'lista'
    ? 'Cada fila es una operación. Pulsa el total de un equipo o el del día para abrir su lista aparte.'
    : st.gran === 'dia'
      ? 'Pulsa cualquier cifra para ver las operaciones que la forman.'
      : 'Pulsa cualquier cifra para ver las operaciones que la forman. Pulsa un día —arriba— para elegirlo; puedes marcar varios.'
  const tabla = st.gran === 'dia' ? (st.vistaDia === 'tipos' ? htmlHojaDiaTipos(ctx) : htmlHojaDiaLista(ctx)) : htmlHojaDias(ctx)
  const leyenda = st.gran === 'dia' && st.vistaDia === 'lista' ? '' : `<span class="f-leyenda" aria-hidden="true">menos <span class="p">${ESCALA.map((p) => `<i style="background:${p.bg}"></i>`).join('')}</span> más</span>`
  return `<section class="f-tarjeta f-malla" aria-labelledby="malla-titulo">
    <div class="f-malla-cab">${icono('receipt')}<h2 id="malla-titulo">${titulo}</h2>${leyenda}</div>
    <div class="f-malla-notas">
      <p>${personas} ${personas === 1 ? 'analista' : 'analistas'} en ${equipos} ${equipos === 1 ? 'equipo' : 'equipos'} · ${moneda}${ocultos}</p>
      <p>${icono('pointer')}${como}</p>
    </div>
    <div class="f-region ac-scroll" role="region" tabindex="0" aria-label="Facturación de ${esc(etiquetaPeriodo(st.gran, st.ancla))} en ${ROTULO_VISTA[st.vista]}, ${ROTULO_TIPO_SELECT[st.tipo]}">${tabla}</div>
  </section>`
}

// ── E6 · Teléfono: tarjetas ──────────────────────────────────────────────────
function botonCifra(clave, spec, mil, texto, aria, clase = '', vista = st.vista) {
  if (mil === 0) return `<span class="f-boton-cifra suave">${esc(texto)}</span>`
  registrar(clave, spec, mil)
  return `<button type="button" class="f-boton-cifra ${clase}" data-cifra="${esc(clave)}" data-valor="${mil}" data-foco="${esc(clave)}" aria-label="${esc(aria)}">${esc(texto)}</button>`
}
function htmlTarjetas(ctx) {
  if (st.gran === 'dia' && st.vistaDia === 'lista') return htmlTarjetasDiaLista(ctx)
  const porTipo = st.gran === 'dia'
  const m = porTipo ? agrupar(ctx.opsRoster, ctx.ops, (o) => o.tipo, () => true) : ctx.malla
  const tTramo = tituloTramo(ctx)
  const dia = ctx.pasados[0]
  let num = 0
  const equipos = m.grupos.map((g) => {
    const cejaG = `Equipo de ${g.nombre}`
    const totG = vm(g.total)
    const tarjetas = g.filas.map((f) => {
      num += 1
      const ceja = cejaPersona(f)
      const mil = vm(f.total)
      const n = vn(f.total)
      const sub = subtituloDe(f, ctx)
      const specTotal = { titulo: tTramo, ceja, dias: ctx.T, aid: f.aid, sid: f.sid, modo: 'suma' }
      let detalle
      if (porTipo) {
        const chips = TIPOS.filter((t) => f.cols.get(t) && vm(f.cols.get(t)) > 0).map((t) => {
          const a = f.cols.get(t)
          const v = vm(a)
          const p = paso(v, m.maxA)
          const clave = registrar(`t|${f.aid}|${f.sid}|${t}`, { titulo: `${mayus(diaLargo(dia))} · ${ROTULO_TIPO[t]}`, ceja, dias: [dia], aid: f.aid, sid: f.sid, tipo: t, modo: 'suma' }, v)
          return `<button type="button" class="f-chip-dia" data-cifra="${clave}" data-valor="${v}" data-foco="${clave}" style="background:${p.bg};color:${p.fg}" aria-label="${esc(f.nombre)}, ${ROTULO_TIPO[t]}: ${dinero(v)}, ${verOps(vn(a))}">${ROTULO_TIPO[t]} · ${compacta(v)}</button>`
        }).join('')
        detalle = chips ? `<p class="f-ta-rotulo">Por tipo</p><div class="f-ta-dias">${chips}</div>` : '<p class="f-ta-vacio">Sin ventas este día.</p>'
      } else {
        const chips = ctx.pasados.filter((d) => f.cols.get(d) && vm(f.cols.get(d)) > 0).map((d) => {
          const a = f.cols.get(d)
          const v = vm(a)
          const p = paso(v, m.maxA)
          const clave = registrar(`a|${f.aid}|${f.sid}|${d}`, { titulo: mayus(diaLargo(d)), ceja, dias: [d], aid: f.aid, sid: f.sid, modo: 'suma' }, v)
          return `<button type="button" class="f-chip-dia" data-cifra="${clave}" data-valor="${v}" data-foco="${clave}" style="background:${p.bg};color:${p.fg}" aria-label="${esc(f.nombre)}, ${diaLargo(d)}: ${dinero(v)}, ${verOps(vn(a))}">${LETRAS[diaSemana(d)]} ${numeroDia(d)} · ${compacta(v)}</button>`
        }).join('')
        detalle = chips ? `<p class="f-ta-rotulo">Días en que vendió</p><div class="f-ta-dias">${chips}</div>` : `<p class="f-ta-vacio">Sin ventas en ${st.gran === 'mes' ? 'este mes' : 'esta semana'} todavía.</p>`
      }
      return `<div role="listitem" class="f-ta">
        <div class="f-ta-cab"><span class="f-ta-num">${num}</span><p class="f-ta-nombre" data-nombre>${esc(f.nombre)}</p></div>
        ${sub ? `<p class="f-ta-sub">${esc(sub)}</p>` : ''}
        <div class="f-ta-cifras">
          ${botonCifra(`aT|${f.aid}|${f.sid}`, specTotal, mil, dinero(mil), `Total de ${f.nombre}: ${dinero(mil)}, ${verOps(n)}`)}
          ${botonCifra(`aC|${f.aid}|${f.sid}`, { ...specTotal, modo: 'conteo' }, n, operaciones(n), `${operaciones(n)} de ${f.nombre}: ver la lista`, 'suave')}
        </div>
        ${detalle}
      </div>`
    }).join('')
    return `<section class="f-eq" aria-labelledby="eq-${g.sid}">
      <div class="f-eq-cab">
        <h2 id="eq-${g.sid}" class="f-eq-nombre" data-nombre>${esc(g.nombre)}</h2>
        <span class="f-eq-n">${g.filas.length} ${g.filas.length === 1 ? 'analista' : 'analistas'}</span>
        ${botonCifra(`gT|${g.sid}`, { titulo: tTramo, ceja: cejaG, dias: ctx.T, sid: g.sid, modo: 'suma' }, totG, dinero(totG), `Total del ${minusInicial(cejaG)}: ${dinero(totG)}, ${verOps(vn(g.total))}`)}
      </div>
      <div role="list" class="f-eq-lista" aria-label="Analistas del ${esc(minusInicial(cejaG))}">${tarjetas}</div>
    </section>`
  }).join('')
  const etiquetaPie = st.rol === 'supervisor' ? 'Total de tu equipo' : st.equipo || st.tipo !== 'todo' ? 'Total de lo que estás viendo' : 'Total de la empresa'
  const tot = vm(m.total)
  const ceja = alcanceTexto()
  const porDia = porTipo ? '' : ctx.pasados.filter((d) => m.cols.get(d) && vm(m.cols.get(d)) > 0).map((d) => {
    const a = m.cols.get(d)
    const v = vm(a)
    const p = paso(v, m.maxC)
    const clave = registrar(`d|${d}`, { titulo: mayus(diaLargo(d)), ceja, dias: [d], modo: 'suma' }, v)
    return `<button type="button" class="f-chip-dia" data-cifra="${clave}" data-valor="${v}" data-foco="${clave}" style="background:${p.bg};color:${p.fg}" aria-label="${etiquetaPie}, ${diaLargo(d)}: ${dinero(v)}, ${verOps(vn(a))}">${LETRAS[diaSemana(d)]} ${numeroDia(d)} · ${compacta(v)}</button>`
  }).join('')
  return `<div class="f-tarjetas">${equipos}
    <section class="f-total-movil" aria-labelledby="total-movil">
      <h2 id="total-movil">${etiquetaPie}</h2>
      <div class="f-ta-cifras">${botonCifra('T', { titulo: tTramo, ceja, dias: ctx.T, modo: 'suma' }, tot, dinero(tot), `${etiquetaPie}: ${dinero(tot)}, ${verOps(vn(m.total))}`)}</div>
      ${porDia ? `<p class="f-ta-rotulo">Por día</p><div class="f-ta-dias">${porDia}</div>` : ''}
    </section>
  </div>`
}
function htmlTarjetasDiaLista(ctx) {
  const dia = ctx.pasados[0]
  const ops = ctx.ops.filter((o) => st.vista === 'TOTAL' || o.moneda === st.vista)
  const porEquipo = new Map()
  for (const o of ops) { if (!porEquipo.has(o.supervisorId)) porEquipo.set(o.supervisorId, []); porEquipo.get(o.supervisorId).push(o) }
  const tDia = mayus(diaLargo(dia))
  let num = 0
  const grupos = [...porEquipo.entries()].map(([sid, l]) => ({ sid, ops: l.sort((a, b) => ORDEN_A[a.analistaId] - ORDEN_A[b.analistaId] || b.capital - a.capital), a: l.reduce(sumar, vacio()) })).sort((x, y) => vm(y.a) - vm(x.a))
  const html = grupos.map((g) => {
    const cejaG = `Equipo de ${NOMBRE_SUP[g.sid]}`
    const tot = vm(g.a)
    return `<section class="f-eq" aria-labelledby="eqd-${g.sid}">
      <div class="f-eq-cab"><h2 id="eqd-${g.sid}" class="f-eq-nombre" data-nombre>${esc(NOMBRE_SUP[g.sid])}</h2><span class="f-eq-n">${operaciones(g.ops.length)}</span>
        ${botonCifra(`gT|${g.sid}`, { titulo: tDia, ceja: cejaG, dias: [dia], sid: g.sid, modo: 'suma' }, tot, dinero(tot), `Total del día del ${minusInicial(cejaG)}: ${dinero(tot)}, ${verOps(vn(g.a))}`)}</div>
      <div role="list" class="f-ta-ops" aria-label="Operaciones del ${esc(minusInicial(cejaG))}">${g.ops.map((o) => { num += 1; return htmlOpTarjeta(o, num, true, false) }).join('')}</div>
    </section>`
  }).join('')
  const a = ops.reduce(sumar, vacio())
  const tot = vm(a)
  return `<div class="f-tarjetas">${html || '<p class="f-ta-vacio">Todavía no hay cierres este día.</p>'}
    <section class="f-total-movil" aria-labelledby="total-dia-movil"><h2 id="total-dia-movil">${st.rol === 'supervisor' ? 'Total de tu equipo' : 'Total del día'}</h2>
      <div class="f-ta-cifras">${botonCifra('T', { titulo: tDia, ceja: alcanceTexto(), dias: [dia], modo: 'suma' }, tot, dinero(tot), `Total del día: ${dinero(tot)}, ${verOps(vn(a))}`)}</div></section>
  </div>`
}
function htmlOpTarjeta(o, num, conAnalista, conFecha) {
  return `<div role="listitem" class="f-op">
    <div class="f-op-cab"><span class="f-op-n">${num}</span><p class="f-op-cli">${clienteOculto(o) ? htmlCliente(o) : `<span data-nombre>${esc(o.cliente)}</span>`}</p><p class="f-op-monto">${money(o.capital, o.moneda)}</p></div>
    <p class="f-op-det">${conFecha ? `<span>${diaCorto(o.dia)}</span>` : ''}${htmlTipo(o)}<span class="tab">${clienteOculto(o) ? 'N.º oculto' : o.numero}</span><span>${o.moneda === 'PEN' ? 'Soles' : 'Dólares'}</span>${htmlAnulada(o)}</p>
    ${conAnalista ? `<p class="f-op-det"><span data-nombre style="font-size:16px">${esc(o.analistaNombre)}</span></p>` : ''}
  </div>`
}

function htmlPantalla(movil) {
  const ctx = contexto()
  return `${htmlHerramientas(ctx, movil)}${htmlPastillas(ctx)}${movil ? htmlTarjetas(ctx) : htmlMalla(ctx)}`
}

// ─────────────────────────────────────────────────────────────────────────────
// L1 · LA LISTA de una cifra. Sale de las MISMAS operaciones que la cifra; arriba, la cifra pulsada y la suma.
// ─────────────────────────────────────────────────────────────────────────────
function opsDeLista(spec) {
  const ambas = spec.ambas || st.vista === 'TOTAL'
  return opsDeDias(spec.dias)
    .filter((o) => enAlcance(o)
      && (spec.tipo ? o.tipo === spec.tipo : pasaTipo(o))
      && (!spec.aid || o.analistaId === spec.aid)
      && (!spec.sid || o.supervisorId === spec.sid)
      && (ambas || o.moneda === st.vista))
    .sort(ordenLista)
}

function htmlLista(spec, movil) {
  const ambas = spec.ambas || st.vista === 'TOTAL'
  const vistaL = ambas ? 'TOTAL' : st.vista
  const ops = opsDeLista(spec)
  const a = ops.reduce(sumar, vacio())
  const suma = vm(a, vistaL)
  const conFecha = spec.dias.length > 1
  const mismoMes = spec.dias.every((d) => d.slice(0, 7) === spec.dias[0].slice(0, 7))
  const nCoop = ops.filter((o) => o.tipo === 'cooperativa').length
  const conversion = ambas && a.usd > 0
  let grande
  let linea
  let cuadra
  let cuadraTxt
  if (spec.modo === 'conteo') {
    grande = operaciones(spec.valor)
    linea = `= ${nf(ops.length - nCoop, 0)} ${ops.length - nCoop === 1 ? 'contrato' : 'contratos'} + ${nf(nCoop, 0)} ${nCoop === 1 ? 'cooperativa' : 'cooperativas'} · suman ${dinero(suma, vistaL)}`
    cuadra = ops.length === spec.valor
    cuadraTxt = cuadra ? `La lista tiene ${operaciones(ops.length)}: las mismas que dice la cifra` : `Ojo: la lista tiene ${ops.length} y la cifra dice ${spec.valor}`
  } else if (spec.modo === 'comparacion') {
    const c = spec.comp
    grande = c.texto
    linea = `Antes (${c.periodo}): ${dinero(c.antes)} → ahora: ${dinero(c.ahora)}`
    cuadra = suma === c.antes
    cuadraTxt = cuadra ? `Esta es la lista de ANTES: suma ${dinero(suma, vistaL)}, la cifra con la que se compara` : `Ojo: la lista de antes suma ${dinero(suma, vistaL)}`
  } else if (spec.modo === 'promedio') {
    grande = dinero(spec.valor, vistaL)
    linea = `= ${dinero(suma, vistaL)} ÷ ${spec.habiles} ${spec.habiles === 1 ? 'día hábil' : 'días hábiles'} (el domingo no cuenta)`
    cuadra = Math.round(suma / 1000 / spec.habiles) * 1000 === spec.valor
    cuadraTxt = 'El promedio no tiene lista propia: esta es la del tramo, de donde sale'
  } else {
    grande = dinero(spec.valor, vistaL)
    linea = conversion
      ? `= ${money(a.pen, 'PEN')} en soles + ${money(a.usd, 'USD')} × ${TASA_TXT}`
      : ambas ? `= ${money(a.pen, 'PEN')}, todo en soles` : `= ${dinero(suma, vistaL)}, solo ${vistaL === 'USD' ? 'dólares' : 'soles'}`
    cuadra = suma === spec.valor
    cuadraTxt = cuadra ? `La lista suma ${dinero(suma, vistaL)}: igual que la cifra que pulsaste` : `Ojo: la lista suma ${dinero(suma, vistaL)} y la cifra dice ${dinero(spec.valor, vistaL)}`
  }
  const meta = [operaciones(ops.length), ROTULO_TIPO_SELECT[spec.tipo ?? st.tipo], ambas ? 'Todo S/' : ROTULO_VISTA[st.vista]]
  if (conversion) meta.push(ROTULO_TASA)
  // Ámbito del supervisor: la venta vieja de quien cambió de equipo cuenta, pero su cliente ya es de otro equipo.
  const ajenas = st.rol === 'supervisor' ? ops.filter((o) => o.otroEquipo).length : 0
  const aviso = ajenas
    ? `<div class="f-aviso" role="note">${icono('info')}<p>${st.clienteAjeno === 'oculto'
      ? `Jorge Palomino ya no está en tu equipo: sus ventas de antes siguen contando para ti, pero sus clientes ahora son de otro equipo. Por eso ves ${ajenas === 1 ? 'el importe' : 'los importes'} y no ${ajenas === 1 ? 'el nombre' : 'los nombres'}.`
      : 'Jorge Palomino ya no está en tu equipo y sus clientes tampoco; con esta opción igual ves sus nombres.'}</p></div>` : ''
  // Con varias personas, una BANDA por analista (como los equipos en la hoja): su subtotal es la fila de ese analista
  // en la hoja. Dentro de la banda, el orden estable del plan: día, moneda, monto de mayor a menor.
  const agrupa = !spec.aid
  const bandas = new Map()
  const claveBanda = (o) => `${o.analistaId}|${o.supervisorId}`
  if (agrupa) {
    for (const o of ops) {
      const k = claveBanda(o)
      if (!bandas.has(k)) bandas.set(k, { nombre: o.analistaNombre, sid: o.supervisorId, a: vacio() })
      sumar(bandas.get(k).a, o)
    }
    const rango = new Map([...bandas.entries()].sort(([, x], [, y]) => vm(y.a, vistaL) - vm(x.a, vistaL) || x.nombre.localeCompare(y.nombre, 'es')).map(([k], i) => [k, i]))
    ops.sort((x, y) => rango.get(claveBanda(x)) - rango.get(claveBanda(y)) || ordenLista(x, y))
  }
  const variosEquipos = new Set(ops.map((o) => o.supervisorId)).size > 1
  const detalleBanda = (b, sigue) => `${variosEquipos ? `equipo de ${NOMBRE_SUP[b.sid]} · ` : ''}${operaciones(vn(b.a, vistaL))}${sigue ? ' · sigue de la página anterior' : ''}`
  const paginas = Math.max(1, Math.ceil(ops.length / POR_PAGINA))
  st.pagina = Math.min(st.pagina, paginas)
  const desde = (st.pagina - 1) * POR_PAGINA
  const visibles = ops.slice(desde, desde + POR_PAGINA)
  const sigueDeAntes = (i) => i === 0 && desde > 0 && claveBanda(ops[desde - 1]) === claveBanda(visibles[0])
  // Subtotales: cada moneda con su suma y, en «Todo S/», el total con la misma tasa que la malla.
  const subt = []
  if (a.nPen) subt.push([`Soles · ${operaciones(a.nPen)}`, money(a.pen, 'PEN')])
  if (a.nUsd) subt.push(conversion ? [`Dólares · ${operaciones(a.nUsd)} · ${money(a.usd, 'USD')} × ${TASA_TXT}`, money(a.usd * TASA_MIL / 1000, 'PEN')] : [`Dólares · ${operaciones(a.nUsd)}`, money(a.usd, 'USD')])
  const totalTxt = ambas ? `Total en soles${paginas > 1 ? ` · las ${ops.length} operaciones` : ''}` : `Total${paginas > 1 ? ` · las ${ops.length} operaciones` : ''}`
  let cuerpo
  if (ops.length === 0) {
    cuerpo = '<p class="f-aviso" style="margin:16px 20px">Ya no hay operaciones detrás de esta cifra.</p>'
  } else if (movil) {
    let tarjetas = ''
    let previa = null
    visibles.forEach((o, i) => {
      if (agrupa && claveBanda(o) !== previa) {
        const b = bandas.get(claveBanda(o))
        tarjetas += `<p class="f-ops-banda"><b data-nombre>${esc(b.nombre)}</b><span>${detalleBanda(b, sigueDeAntes(i))}</span><b class="tab">${dinero(vm(b.a, vistaL), vistaL)}</b></p>`
        previa = claveBanda(o)
      }
      tarjetas += htmlOpTarjeta(o, desde + i + 1, false, conFecha)
    })
    cuerpo = `<div role="list" class="f-ops" aria-label="Operaciones">${tarjetas}
      <div class="f-subtotales">${subt.map(([t, v]) => `<p><span>${t}</span><b>${v}</b></p>`).join('')}<p class="total"><span>${totalTxt}</span><b>${dinero(suma, vistaL)}</b></p></div></div>`
  } else {
    const nCols = 5 + (conFecha ? 1 : 0)
    const fila = (o, n) => `<tr>
        <td class="l-n">${n}</td>
        ${conFecha ? `<td class="l-fecha">${mismoMes ? diaMedioCorto(o.dia) : diaCorto(o.dia)}</td>` : ''}
        <th scope="row" class="l-cli"><span class="l-cli-in">${htmlCliente(o)}${htmlAnulada(o)}</span></th>
        <td class="l-num l-tab">${clienteOculto(o) ? '—' : o.numero}</td>
        <td class="l-tipo">${htmlTipo(o)}</td>
        <td class="l-mon">${o.moneda === 'PEN' ? 'Soles' : 'Dólares'}</td>
        <td class="l-monto" data-monto="${o.capital}" data-moneda="${o.moneda}">${money(o.capital, o.moneda)}</td>
      </tr>`
    let filas = ''
    let previa = null
    visibles.forEach((o, i) => {
      if (agrupa && claveBanda(o) !== previa) {
        if (previa !== null) filas += '</tbody>'
        const b = bandas.get(claveBanda(o))
        filas += `<tbody><tr class="l-banda"><th scope="rowgroup" colspan="${nCols}"><span class="l-banda-nom" data-nombre>${esc(b.nombre)}</span><span class="l-banda-det">${detalleBanda(b, sigueDeAntes(i))}</span></th><td class="l-monto">${dinero(vm(b.a, vistaL), vistaL)}</td></tr>`
        previa = claveBanda(o)
      }
      filas += fila(o, desde + i + 1)
    })
    cuerpo = `<table class="f-lt">
      <caption class="sr-only">${esc(spec.titulo)} · ${esc(spec.ceja)}: operaciones</caption>
      <thead><tr>
        <th scope="col" class="l-n"><span aria-hidden="true">#</span><span class="sr-only">Número de fila</span></th>
        ${conFecha ? '<th scope="col" class="l-fecha">Fecha</th>' : ''}
        <th scope="col" class="l-cli"><span class="l-cli-in">Cliente</span></th><th scope="col" class="l-num">N.º</th><th scope="col" class="l-tipo">Tipo</th>
        <th scope="col" class="l-mon">Moneda</th><th scope="col" class="l-monto">Monto</th>
      </tr></thead>
      ${agrupa ? `${filas}</tbody>` : `<tbody>${filas}</tbody>`}
      <tfoot>${subt.map(([t, v]) => `<tr><th scope="row" colspan="${nCols}">${t}</th><td class="l-monto">${v}</td></tr>`).join('')}
        <tr class="total"><th scope="row" colspan="${nCols}">${totalTxt}</th><td class="l-monto">${dinero(suma, vistaL)}</td></tr></tfoot>
    </table>`
  }
  const pie = paginas > 1 ? `<div class="f-lista-pie"><span>Filas ${desde + 1}–${desde + visibles.length} de ${ops.length} · de 50 en 50</span>
    <button type="button" class="f-boton" data-accion="paginaAnterior" data-foco="pag-ant"${st.pagina === 1 ? ' disabled' : ''}>${icono('chevronLeft')} Anterior</button>
    <button type="button" class="f-boton" data-accion="paginaSiguiente" data-foco="pag-sig"${st.pagina === paginas ? ' disabled' : ''}>Siguiente ${icono('chevronRight')}</button></div>` : ''
  // Columnas fijas (# 44, N.º 132, Tipo 112, Moneda 78, Monto 112) + Cliente ~200 + borde y riel de desplazamiento.
  const ancho = 690 + (conFecha ? 80 : 0)
  const html = `
    <div class="f-lista-cab">
      <div class="f-lista-txt" id="lista-foco" tabindex="-1">
        <p class="f-lista-ceja">${esc(spec.ceja)}</p>
        <h2 class="f-lista-titulo" id="lista-titulo">${esc(spec.titulo)}${spec.queEs ? ` · ${esc(spec.queEs)}` : ''}</h2>
        <p class="f-lista-cifra" id="lista-cifra">${esc(grande)}</p>
        <p class="f-lista-suma" id="lista-suma">${esc(linea)}</p>
        <p class="f-cuadra${cuadra ? '' : ' mal'}" id="lista-cuadra">${icono(cuadra ? 'circleCheck' : 'alert')}${esc(cuadraTxt)}</p>
        <p class="f-lista-meta">${esc(meta.join(' · '))}</p>
      </div>
      <button type="button" class="f-cerrar" data-accion="cerrarLista" data-foco="cerrar-lista" aria-label="Cerrar la lista">${icono('x')}</button>
    </div>
    ${aviso}
    <div class="f-lista-cuerpo ac-scroll" role="region" tabindex="0" aria-label="Operaciones de la cifra">${cuerpo}</div>
    ${pie}`
  return { html, ancho, info: { titulo: spec.titulo, cifra: grande, suma: dinero(suma, vistaL), cuadra, filas: ops.length, modo: spec.modo } }
}

function pintarLista(entrada) {
  const caja = document.getElementById('lista')
  if (!caja) return
  const spec = st.lista ? REG.get(st.lista) : null
  if (!spec) {
    st.lista = null
    caja.hidden = true
    caja.innerHTML = ''
    caja.className = ''
    ;['role', 'aria-modal', 'aria-labelledby'].forEach((a) => caja.removeAttribute(a))
    return null
  }
  const { html, ancho, info } = htmlLista(spec, MQ.matches)
  caja.hidden = false
  caja.className = 'f-lista'
  caja.setAttribute('role', 'dialog')
  caja.setAttribute('aria-modal', 'false')
  caja.setAttribute('aria-labelledby', 'lista-titulo')
  caja.style.setProperty('--ancho-lista', `${ancho}px`)
  caja.innerHTML = html
  if (!entrada) { void caja.offsetWidth; caja.classList.add('cambia') }
  return info
}

function marcarAbierta() {
  document.querySelectorAll('[data-cifra]').forEach((el) => el.classList.toggle('abierta', el.dataset.cifra === st.lista))
}

// ─────────────────────────────────────────────────────────────────────────────
// Pintado, eventos y medidas
// ─────────────────────────────────────────────────────────────────────────────
const NAV_GER = [['dashboard', 'Hoy'], ['receiptText', 'Facturación', true], ['trophy', 'Ranking'], ['handshake', 'Citas'], ['calendarCheck', 'Gestión Diaria'], ['target', 'Metas'], ['wallet', 'Mi cartera']]
const NAV_SUP = [['dashboard', 'Hoy'], ['listChecks', 'Seguimiento'], ['calendarCheck', 'Gestión Diaria'], ['handshake', 'Citas'], ['receiptText', 'Facturación', true], ['kanban', 'Pipeline'], ['users', 'Leads'], ['calendarDays', 'Agenda'], ['wallet', 'Mi cartera'], ['archiveRestore', 'Base para gestión']]

function htmlChrome() {
  const sup = st.rol === 'supervisor'
  const items = (sup ? NAV_SUP : NAV_GER).map(([ic, txt, activo]) => `<span class="c-item"${activo ? ' aria-current="page"' : ''} title="${txt}">${icono(ic)}<span class="c-txt">${txt}</span></span>`).join('')
  const grupos = sup ? '' : ['Análisis', 'Operación', 'Administración'].map((g) => `<span class="c-grupo"><span class="c-txt">${g}</span>${icono('chevronDown')}</span>`).join('')
  return `
  <div class="c-aurora" aria-hidden="true"></div>
  <div class="c-app" data-rol="${st.rol}">
    <aside class="c-lateral">
      <div class="c-marca"><span class="c-logo" aria-hidden="true">A</span><span class="c-txt c-marca-txt">Avance Corp</span></div>
      <nav class="c-nav" aria-label="Menú del CRM (maqueta: no navega)">${items}${grupos}</nav>
      <div class="c-usuario"><span class="c-avatar" aria-hidden="true">${sup ? 'VM' : 'GE'}</span><span class="c-usuario-txt"><span class="c-usuario-nombre" style="display:block">${sup ? 'Valeria Mendoza' : 'Usuario de ejemplo'}</span><span class="c-usuario-rol">${sup ? 'Supervisión' : 'Gerencia'}</span></span></div>
    </aside>
    <div class="c-principal">
      <header class="c-barra">
        <div class="c-barra-txt"><h1>Facturación</h1><p class="c-barra-sub">Capital cerrado día a día, por equipo y por analista</p></div>
        <span class="c-ejemplo">Datos de ejemplo</span>
        <span class="c-buscar">${icono('search')}Buscar lead por nombre o teléfono<kbd>⌘K</kbd></span>
        <span class="c-campana" title="Pendientes">${icono('bell')}</span>
      </header>
      <main class="c-contenido ac-scroll" id="contenido"><div id="pantalla" class="f-pantalla"></div></main>
    </div>
    ${sup ? '' : `<nav class="c-abajo" aria-label="Navegación principal de Gerencia (maqueta: no navega)">
      ${[['dashboard', 'Hoy'], ['handshake', 'Citas'], ['calendarCheck', 'Gestión Diaria'], ['ellipsis', 'Más', true]].map(([ic, t, a]) => `<span class="c-destino"${a ? ' aria-current="page"' : ''}><span class="c-destino-ic">${icono(ic)}</span><span>${t}</span></span>`).join('')}
    </nav>`}
  </div>
  <aside id="lista" hidden></aside>
  <p id="anuncio" class="sr-only" role="status" aria-live="polite"></p>`
}

let chromeClave = ''
function pintar() {
  const movil = MQ.matches
  const clave = `${st.rol}|${movil}`
  if (clave !== chromeClave) { raiz.innerHTML = htmlChrome(); chromeClave = clave }
  const pantalla = document.getElementById('pantalla')
  const region = pantalla.querySelector('.f-region')
  const sc = region ? [region.scrollLeft, region.scrollTop] : null
  const contenido = document.getElementById('contenido')
  const scC = contenido.scrollTop
  const activo = document.activeElement
  const foco = activo?.closest?.('[data-foco]')?.dataset.foco ?? null
  const focoEnLista = !!activo?.closest?.('#lista')
  REG.clear()
  pantalla.innerHTML = htmlPantalla(movil)
  const r2 = pantalla.querySelector('.f-region')
  if (r2 && sc) { r2.scrollLeft = sc[0]; r2.scrollTop = sc[1] }
  contenido.scrollTop = scC
  pintarLista(false)
  marcarAbierta()
  if (foco) {
    const el = document.querySelector(`[data-foco="${CSS.escape(foco)}"]`)
    if (el) el.focus({ preventScroll: true })
    else if (focoEnLista) document.getElementById('lista-foco')?.focus({ preventScroll: true })
  }
  medirLuego()
}

function anunciar(texto) {
  const a = document.getElementById('anuncio')
  if (!a) return
  a.textContent = ''
  setTimeout(() => { a.textContent = texto }, 60)
}

/** `moverFoco`: solo cuando se abrió con el teclado (Enter o espacio). Con el ratón el foco se queda en la cifra:
 *  la lista no es modal y se puede seguir pulsando otras cifras. */
function abrirLista(clave, origen, moverFoco = false) {
  const yaAbierta = st.lista != null
  st.lista = clave
  st.pagina = 1
  st.origenLista = origen?.dataset.foco ?? null
  const info = pintarLista(!yaAbierta)
  marcarAbierta()
  if (!info) return
  if (moverFoco) document.getElementById('lista-foco')?.focus({ preventScroll: true })
  anunciar(`Lista abierta: ${info.titulo}, ${info.cifra}, ${operaciones(info.filas)}`)
  avisarMarco({ tipo: 'lista', info })
  medirLuego()
}
function cerrarLista(devolverFoco = true) {
  if (st.lista == null) return
  const origen = st.origenLista
  st.lista = null
  pintarLista(false)
  marcarAbierta()
  if (devolverFoco && origen) document.querySelector(`[data-foco="${CSS.escape(origen)}"]`)?.focus({ preventScroll: true })
  medirLuego()
}

function cambiar(campo, valor) {
  if (campo === 'vista') {
    st.vista = valor
    pintar()
    anunciar(`${ROTULO_VISTA[valor]} · ${etiquetaPeriodo(st.gran, st.ancla)}`)
    return
  }
  if (campo === 'gran') {
    st.marcados = []
    const ultimo = diasDelPeriodo(valor, st.ancla).slice(-1)[0]
    if (ultimo > HOY && primerDiaDelMes(st.ancla) === primerDiaDelMes(HOY)) st.ancla = HOY
    if (valor === 'dia' && st.ancla > HOY) st.ancla = HOY
    st.gran = valor
  }
  if (campo === 'tipo') st.tipo = valor
  if (campo === 'equipo') st.equipo = valor
  cerrarLista(false)
  pintar()
  anunciar(`${mayus(etiquetaPeriodo(st.gran, st.ancla))} · ${ROTULO_VISTA[st.vista]} · ${ROTULO_TIPO_SELECT[st.tipo]}`)
}

function accion(nombre) {
  if (nombre === 'anterior' || nombre === 'siguiente') {
    st.ancla = periodoDesplazado(st.gran, st.ancla, nombre === 'anterior' ? -1 : 1)
    if (st.gran === 'mes' && st.ancla > HOY) st.ancla = HOY
    st.marcados = []
    cerrarLista(false)
    pintar()
    anunciar(mayus(etiquetaPeriodo(st.gran, st.ancla)))
  } else if (nombre === 'restablecer') {
    st.equipo = ''; st.tipo = 'todo'; st.marcados = []
    cerrarLista(false); pintar()
  } else if (nombre === 'quitarMarcados') {
    st.marcados = []; pintar()
  } else if (nombre === 'filtros') {
    st.filtrosAbiertos = !st.filtrosAbiertos; pintar()
  } else if (nombre === 'cerrarLista') {
    cerrarLista(true)
  } else if (nombre === 'paginaAnterior' || nombre === 'paginaSiguiente') {
    st.pagina += nombre === 'paginaSiguiente' ? 1 : -1
    pintarLista(false)
    const cuerpo = document.querySelector('.f-lista-cuerpo')
    if (cuerpo) cuerpo.scrollTop = 0
    document.querySelector(`[data-foco="${nombre === 'paginaSiguiente' ? 'pag-sig' : 'pag-ant'}"]`)?.focus({ preventScroll: true })
    medirLuego()
  }
}

function alPulsar(e) {
  const t = e.target.closest('button')
  if (!t || t.disabled) return
  if (t.dataset.cifra) return abrirLista(t.dataset.cifra, t, e.detail === 0)
  if (t.dataset.campo) return cambiar(t.dataset.campo, t.dataset.valor)
  if (t.dataset.dia) {
    const d = t.dataset.dia
    st.marcados = st.marcados.includes(d) ? st.marcados.filter((x) => x !== d) : [...st.marcados, d].sort()
    pintar()
    anunciar(st.marcados.length ? `${st.marcados.length} ${st.marcados.length === 1 ? 'día elegido' : 'días elegidos'}` : 'Sin días elegidos')
    return
  }
  if (t.dataset.banda) {
    const s = t.dataset.banda
    st.cerrados = st.cerrados.includes(s) ? st.cerrados.filter((x) => x !== s) : [...st.cerrados, s]
    pintar()
    return
  }
  if (t.dataset.accion) accion(t.dataset.accion)
}

// El cursor ilumina su fila y su columna en la hoja (y la pastilla sigue al cursor con un brillo).
let cruzActual = { fila: null, col: null }
function pintarCruz(fila, col) {
  if (cruzActual.fila && cruzActual.fila !== fila) cruzActual.fila.classList.remove('cruz')
  if (fila && fila !== cruzActual.fila) fila.classList.add('cruz')
  if (col !== cruzActual.col) {
    let estilo = document.getElementById('estilo-cruz')
    if (!estilo) { estilo = document.createElement('style'); estilo.id = 'estilo-cruz'; document.head.appendChild(estilo) }
    estilo.textContent = col == null ? '' : `
      .f-hoja tbody [data-c="${col}"], .f-hoja tfoot [data-c="${col}"] { background-color: var(--cruz); }
      .f-hoja thead [data-c="${col}"]:not(.marcado), .f-hoja tbody tr.banda > [data-c="${col}"] { background-color: var(--cruz-fuerte); }
      .f-hoja thead [data-c="${col}"]:not(.marcado) .f-dia-num { color: var(--accent-press); }`
  }
  cruzActual = { fila, col }
}
function alMover(e) {
  const p = e.target.closest?.('.f-pastilla')
  if (p) {
    const r = p.getBoundingClientRect()
    p.style.setProperty('--mx', `${e.clientX - r.left}px`)
    p.style.setProperty('--my', `${e.clientY - r.top}px`)
  }
  const celdaH = e.target.closest?.('.f-hoja th, .f-hoja td')
  if (!celdaH) return pintarCruz(null, null)
  const tr = celdaH.parentElement
  const fila = tr.closest('tbody') ? tr : null
  pintarCruz(fila, celdaH.dataset.c ?? null)
}

let temporizadorMedida = 0
function medirLuego() {
  clearTimeout(temporizadorMedida)
  temporizadorMedida = setTimeout(() => {
    Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]).then(() => requestAnimationFrame(() => avisarMarco({ tipo: 'medidas', medidas: medir() })))
  }, 160)
}
function avisarMarco(mensaje) { if (window.parent !== window) window.parent.postMessage(mensaje, '*') }

/** Medidas REALES del lienzo, para que el marco diga si cumple cada regla. */
function medir() {
  const rgb = (c) => { const m = c.match(/rgba?\(([^)]+)\)/); if (!m) return [255, 255, 255, 0]; const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p[3] ?? 1] }
  const lum = ([r, g, b]) => { const c = [r, g, b].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4 }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] }
  const fondo = (el) => {
    const capas = []
    for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
      const c = rgb(getComputedStyle(n).backgroundColor)
      if (c[3] > 0) capas.push(c)
      if (c[3] >= 1) break
    }
    let base = [255, 255, 255]
    for (let i = capas.length - 1; i >= 0; i -= 1) { const [r, g, b, al] = capas[i]; base = [r * al + base[0] * (1 - al), g * al + base[1] * (1 - al), b * al + base[2] * (1 - al)] }
    return base
  }
  const contraste = (a, b) => { const x = lum(a); const y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05) }
  const zonas = [document.getElementById('pantalla'), document.getElementById('lista')].filter((z) => z && !z.hidden)
  let letraMin = Infinity
  let letraMinTxt = ''
  let contrasteMin = Infinity
  let contrasteTxt = ''
  for (const z of zonas) {
    for (const el of z.querySelectorAll('*')) {
      const propio = [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())
      if (!propio || el.closest('.sr-only')) continue
      const r = el.getBoundingClientRect()
      if (r.width === 0 || r.height === 0) continue
      const cs = getComputedStyle(el)
      if (cs.visibility === 'hidden') continue
      const fs = parseFloat(cs.fontSize)
      if (fs < letraMin) { letraMin = fs; letraMinTxt = el.textContent.trim().slice(0, 40) }
      const c = contraste(rgb(cs.color), fondo(el))
      if (c < contrasteMin) { contrasteMin = c; contrasteTxt = el.textContent.trim().slice(0, 40) }
    }
  }
  const nombres = zonas.flatMap((z) => [...z.querySelectorAll('[data-nombre]')]).filter((el) => el.getBoundingClientRect().width > 0)
  const region = document.querySelector('.f-region')
  const tabla = region?.querySelector('table')
  const pastillas = document.querySelector('.f-pastillas')
  const sticky = (sel) => { const el = document.querySelector(sel); return el ? getComputedStyle(el).position === 'sticky' : false }
  const cabPv = document.querySelector('.f-hoja thead .c-pv')
  const thTodos = zonas.flatMap((z) => [...z.querySelectorAll('th')])
  const contenido = document.getElementById('contenido')
  return {
    ancho: window.innerWidth,
    movil: MQ.matches,
    rol: st.rol,
    gran: st.gran,
    vista: st.vista,
    vistaDia: st.vistaDia,
    diasPorVenir: st.diasPorVenir,
    mesEnCurso: st.gran === 'mes' && primerDiaDelMes(st.ancla) === primerDiaDelMes(HOY),
    altoResumen: pastillas ? Math.round(pastillas.getBoundingClientRect().height) : null,
    pastillas: pastillas ? pastillas.querySelectorAll('.f-pastilla').length : 0,
    pastillasBotones: pastillas ? pastillas.querySelectorAll('button.f-pastilla').length : 0,
    letraMin: Number.isFinite(letraMin) ? letraMin : null,
    letraMinTxt,
    nombresMin: nombres.length ? Math.min(...nombres.map((el) => parseFloat(getComputedStyle(el).fontSize))) : null,
    anchoCelda: document.querySelector('.f-hoja thead .c-dia')?.getBoundingClientRect().width ?? null,
    fijos: { cabecera: sticky('.f-hoja thead th'), numero: sticky('.f-hoja tbody .c-num'), nombre: sticky('.f-hoja tbody .c-nom'), total: sticky('.f-hoja tbody .c-tot') },
    bandas: document.querySelectorAll('.f-hoja tr.banda').length,
    filasNumeradas: [...document.querySelectorAll('.f-hoja tbody .c-num')].filter((c) => c.textContent.trim()).length,
    diasColumnas: document.querySelectorAll('.f-hoja thead .c-dia').length,
    porVenir: cabPv ? cabPv.innerText.trim().split(/\s*\n+\s*/).join(' · ') : null,
    scrollLateral: region ? region.scrollWidth - region.clientWidth > 1 : false,
    paginaScrollLateral: document.documentElement.scrollWidth > window.innerWidth + 1 || (contenido ? contenido.scrollWidth > contenido.clientWidth + 1 : false),
    hueco: st.gran === 'dia' && region && tabla ? Math.max(0, (region.clientWidth - tabla.getBoundingClientRect().width) / region.clientWidth) : null,
    tarjetas: document.querySelectorAll('.f-ta').length,
    cifras: document.querySelectorAll('#pantalla [data-cifra]').length,
    tasaVisible: document.body.textContent.includes(ROTULO_TASA) || document.body.textContent.includes(`S/ ${TASA_TXT}`),
    contrasteMin: Number.isFinite(contrasteMin) ? Math.round(contrasteMin * 100) / 100 : null,
    contrasteTxt,
    botones: zonas.reduce((n, z) => n + z.querySelectorAll('button').length, 0),
    thConScope: thTodos.filter((t) => t.hasAttribute('scope')).length,
    thSinScope: thTodos.filter((t) => !t.hasAttribute('scope')).length,
    listaAbierta: st.lista != null,
  }
}

function aplicarEstado(e) {
  if (!e) return
  const antes = `${st.rol}|${st.diasPorVenir}|${st.vistaDia}|${st.clienteAjeno}`
  if (e.rol && e.rol !== st.rol) { st.rol = e.rol; st.equipo = ''; st.cerrados = []; cerrarLista(false) }
  if (e.diasPorVenir) st.diasPorVenir = e.diasPorVenir
  if (e.vistaDia) st.vistaDia = e.vistaDia
  if (e.clienteAjeno) st.clienteAjeno = e.clienteAjeno
  if (antes !== `${st.rol}|${st.diasPorVenir}|${st.vistaDia}|${st.clienteAjeno}`) pintar()
}
function alMensaje(ev) {
  if (ev.source !== window.parent) return
  const m = ev.data
  if (!m || typeof m !== 'object') return
  if (m.tipo === 'estado') aplicarEstado(m.estado)
  if (m.tipo === 'accion') {
    if (m.accion === 'irMes') { st.gran = 'mes'; st.ancla = HOY; st.marcados = []; cerrarLista(false); pintar() }
    if (m.accion === 'irDia') { st.gran = 'dia'; if (st.ancla > HOY || primerDiaDelMes(st.ancla) !== primerDiaDelMes(HOY)) st.ancla = HOY; st.marcados = []; cerrarLista(false); pintar() }
    if (m.accion === 'casoCliente') {
      // El caso de la decisión 3: la supervisora mira lo que vendió Jorge Palomino cuando era de su equipo.
      st.gran = 'mes'; st.ancla = HOY; st.marcados = []; st.tipo = 'todo'; st.cerrados = []
      pintar()
      const el = document.querySelector('[data-cifra="aT|f-a02|f-sup1"]')
      if (el) { el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); abrirLista('aT|f-a02|f-sup1', el) }
    }
  }
}

function arrancarLienzo() {
  st.rol = params.get('rol') === 'supervisor' ? 'supervisor' : 'gerencia'
  st.diasPorVenir = params.get('a') === 'ocultos' ? 'ocultos' : 'plegados'
  st.vistaDia = params.get('b') === 'lista' ? 'lista' : 'tipos'
  st.clienteAjeno = params.get('c') === 'nombre' ? 'nombre' : 'oculto'
  if (['mes', 'semana', 'dia'].includes(params.get('gran'))) st.gran = params.get('gran')
  if (['TOTAL', 'PEN', 'USD'].includes(params.get('vista'))) st.vista = params.get('vista')
  document.title = 'Lienzo · Facturación'
  pintar()
  document.addEventListener('click', alPulsar)
  document.addEventListener('change', (e) => { const s = e.target.closest('select[data-campo]'); if (s) cambiar(s.dataset.campo, s.value) })
  document.addEventListener('pointermove', alMover)
  document.addEventListener('pointerleave', () => pintarCruz(null, null))
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.lista != null) { e.preventDefault(); cerrarLista(true) } })
  MQ.addEventListener('change', () => { cerrarLista(false); pintar() })
  window.addEventListener('resize', medirLuego) // el marco anima el ancho: se mide cuando termina
  window.addEventListener('message', alMensaje)
  avisarMarco({ tipo: 'listo' })
  // Para comprobarla desde fuera (pruebas de la pieza).
  window.__pieza = { st, REG, opsDeDias, operacionesDelMes, abrirLista, medir, TASA_MIL }
}

// ═════════════════════════════════════════════════════════════════════════════
// EL MARCO: qué es, las tres decisiones en vivo, el lienzo a escala real y lo que cumple, medido.
// ═════════════════════════════════════════════════════════════════════════════
function arrancarMarco() {
  const pildora = (grupo, valor, texto, activa) =>
    `<button type="button" class="m-pildora" data-grupo="${grupo}" data-valor="${valor}" aria-pressed="${activa}">${texto}</button>`
  const opcion = (grupo, valor, texto, activa, recomendada) =>
    `<button type="button" class="m-opcion" data-grupo="${grupo}" data-valor="${valor}" aria-pressed="${activa}"><span class="m-marca" aria-hidden="true">${icono('check')}</span><span>${texto}</span>${recomendada ? '<span class="m-sello">recomendado</span>' : ''}</button>`
  const decision = (grupo, n, pregunta, opciones, pista) => `
    <div class="m-decision" role="group" aria-labelledby="d-${grupo}">
      <div class="m-decision-cab"><span class="m-decision-num" aria-hidden="true">${n}</span><p class="m-decision-preg" id="d-${grupo}">${pregunta}</p></div>
      ${opciones.map(([v, t, rec], i) => opcion(grupo, v, t, i === 0, rec)).join('')}
      <p class="m-pista">${pista}</p>
    </div>`
  raiz.innerHTML = `
  <div class="m-pagina">
    <header class="m-cab">
      <div>
        <p class="m-ceja">CRM Avance Corp · pieza para decidir viendo · datos de ejemplo</p>
        <h1>Facturación como hoja de Excel — propuesta para aprobar, fase 3</h1>
        <p class="m-entrada">Es la pantalla de Facturación a tamaño real con lo que propone el plan: cifras pequeñas arriba, la malla como una hoja y <b>todo número se abre</b> en una lista que suma exactamente esa cifra. Pásale el ratón por encima y pulsa cualquier número. Nombres y cifras inventados; hoy es jueves 08/10/2026.</p>
      </div>
      <div class="m-fila">
        <div class="m-grupo" role="group" aria-labelledby="g-ancho"><span class="m-rotulo" id="g-ancho">Ver en</span>${pildora('ancho', 'escritorio', 'Escritorio 1440', true)}${pildora('ancho', 'telefono', 'Teléfono 390', false)}</div>
        <div class="m-grupo" role="group" aria-labelledby="g-rol"><span class="m-rotulo" id="g-rol">Ver como</span>${pildora('rol', 'gerencia', 'Gerencia', true)}${pildora('rol', 'supervisor', 'Supervisora · Valeria Mendoza', false)}</div>
        <a class="m-enlace" href="#reglas" id="m-cuenta">Lo que cumple, medido en vivo ↓</a>
      </div>
      <div class="m-decisiones">
        ${decision('a', 1, 'Los días del mes que aún no pasan', [['plegados', 'En una sola columna «9–31 oct · por venir»', true], ['ocultos', 'Ocultos: solo los días que ya pasaron', false]], 'Al tocarla, el lienzo vuelve a la vista Mes de octubre.')}
        ${decision('b', 2, 'La pestaña «Día»', [['tipos', 'Columnas por tipo: Nuevo · Renovación · Upgrade · Cooperativa · Total', true], ['lista', 'Directamente la lista de operaciones del día', false]], 'Al tocarla, el lienzo abre la pestaña Día (hoy, jueves 8).')}
        ${decision('c', 3, 'El supervisor, si el cliente de una venta ya es de otro equipo, ve…', [['oculto', '«Cliente de otro equipo» y el importe', true], ['nombre', 'El nombre del cliente', false]], 'Al tocarla, te pone como Valeria Mendoza y abre lo que vendió Jorge Palomino antes de cambiarse de equipo.')}
      </div>
    </header>
    <main class="m-escenario">
      <div class="m-lienzo-caja">
        <p class="m-medida" id="m-medida">Escritorio · 1440 × 900 px · escala 1:1</p>
        <iframe id="lienzo" title="Lienzo: la pantalla Facturación del CRM a escala real" style="width:1442px;height:902px"></iframe>
      </div>
    </main>
    <section class="m-reglas" id="reglas" aria-labelledby="reglas-titulo">
      <h2 id="reglas-titulo">Lo que cumple, medido en vivo dentro del lienzo</h2>
      <p>Cada línea se vuelve a medir cada vez que cambias algo arriba o dentro del lienzo. «Por medir» quiere decir que esa vista aún no se ha abierto.</p>
      <ol class="m-lista-reglas" id="m-reglas"></ol>
      <p class="m-nota">Siguen como hoy y no se muestran aquí, para no distraer: «Qué se mide» (capital o número de contratos), el filtro de analistas y comparar. El DNI no sale en ninguna lista.</p>
    </section>
  </div>`

  const lienzo = document.getElementById('lienzo')
  const est = { ancho: 'escritorio', rol: 'gerencia', a: 'plegados', b: 'tipos', c: 'oculto' }
  const M = { lista: null }
  const base = location.href.split(/[?#]/)[0]
  const estado = () => ({ rol: est.rol, diasPorVenir: est.a, vistaDia: est.b, clienteAjeno: est.c })
  const enviar = (m) => lienzo.contentWindow?.postMessage(m, '*')
  lienzo.src = `${base}?lienzo=1&rol=${est.rol}&a=${est.a}&b=${est.b}&c=${est.c}`
  const MEDIDAS = { escritorio: [1440, 900, 'Escritorio'], telefono: [390, 844, 'Teléfono'] }

  function marcar(grupo, valor) {
    est[grupo] = valor
    document.querySelectorAll(`[data-grupo="${grupo}"]`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.valor === valor)))
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-grupo]')
    if (!b) return
    const { grupo, valor } = b.dataset
    if (grupo === 'ancho') {
      marcar('ancho', valor)
      const [w, h, nombre] = MEDIDAS[valor]
      lienzo.style.width = `${w + 2}px` // +2: el borde; el interior mide exacto 1440 o 390
      lienzo.style.height = `${h + 2}px`
      document.getElementById('m-medida').textContent = `${nombre} · ${w} × ${h} px · escala 1:1`
      return
    }
    marcar(grupo, valor)
    if (grupo === 'c') marcar('rol', 'supervisor')
    enviar({ tipo: 'estado', estado: estado() })
    if (grupo === 'a') enviar({ tipo: 'accion', accion: 'irMes' })
    if (grupo === 'b') enviar({ tipo: 'accion', accion: 'irDia' })
    if (grupo === 'c') enviar({ tipo: 'accion', accion: 'casoCliente' })
  })

  const REGLAS = [
    ['Cifras de arriba pequeñas', () => {
      const e = M.escritorio
      if (!e) return ['pendiente', 'Se mide en «Escritorio 1440».']
      return [e.altoResumen <= 56 && e.pastillasBotones === e.pastillas ? 'ok' : 'mal', `Una fila de ${e.pastillas} pastillas de 14 px, todas pulsables: el resumen mide ${e.altoResumen} px de alto (hoy, con tarjetas, mide 196).`]
    }],
    ['La malla es una hoja', () => {
      const e = M.hoja
      if (!e) return ['pendiente', 'Se mide en la vista Mes o Semana de escritorio.']
      const f = e.fijos
      const ok = f.cabecera && f.numero && f.nombre && f.total && e.bandas > 0 && e.filasNumeradas > 0
      return [ok ? 'ok' : 'mal', `Cuadrícula con # de fila (1 a ${e.filasNumeradas}), cabecera gris fija, # y nombre fijos a la izquierda, total fijo a la derecha y ${e.bandas} equipos como bandas.`]
    }],
    ['Letra cómoda', () => {
      if (M.letraMin == null) return ['pendiente', 'Midiendo…']
      const ok = M.letraMin >= 14 && M.nombresMin >= 16
      const celda = M.hoja?.anchoCelda ? ` Celdas de ${Math.round(M.hoja.anchoCelda)} px de ancho.` : ''
      return [ok ? 'ok' : 'mal', `En todo lo que has visto: nombres a ${M.nombresMin} px como mínimo (piso 16) y nada por debajo de ${M.letraMin} px (piso 14; lo más pequeño: «${M.letraMinTxt}»).${celda}`]
    }],
    ['Días por venir', () => {
      const e = M.mesActual
      if (!e) return ['pendiente', 'Se mide en la vista Mes de octubre, en escritorio.']
      if (e.diasPorVenir === 'plegados') return [e.porVenir && !e.scrollLateral ? 'ok' : 'mal', `${e.diasColumnas} días + 1 columna «${e.porVenir}»${e.scrollLateral ? '; ojo: hay que desplazarse de lado' : '; a 1440 px no hay que desplazarse de lado'}.`]
      return [!e.porVenir && !e.scrollLateral ? 'ok' : 'mal', `Solo los ${e.diasColumnas} días que ya pasaron; del 9 al 31 no se muestran (lo dice la nota de la malla).`]
    }],
    ['Todo número se abre', () => {
      const e = M.ultimo
      if (!e) return ['pendiente', 'Midiendo…']
      const l = M.lista
      const ultima = l ? ` Última lista abierta: «${l.titulo}» ${l.cifra} → ${l.modo === 'comparacion' ? 'la lista de antes suma' : 'la lista suma'} ${l.suma} en ${l.filas} ${l.filas === 1 ? 'operación' : 'operaciones'} ${l.cuadra ? '✓' : '✗'}.` : ' Pulsa cualquier número del lienzo para comprobarlo aquí.'
      return [e.cifras > 0 && (!l || l.cuadra) ? 'ok' : 'mal', `${e.cifras} cifras pulsables en la pantalla (celdas, totales, bandas, pie y pastillas); un cero no se abre.${ultima}`]
    }],
    ['Perilla de moneda', () => {
      const e = M.ultimo
      if (!e) return ['pendiente', 'Midiendo…']
      const vista = { TOTAL: 'Todo S/', PEN: 'Soles', USD: 'Dólares' }[e.vista]
      return [e.tasaVisible ? 'ok' : 'mal', `Todo S/ · Soles · Dólares (ahora: ${vista}). La tasa se dice sin siglas: «tipo de cambio S/ 3.751 (SBS, promedio de 7 días hábiles)».`]
    }],
    ['Vista Día por tipo', () => {
      const e = M.diaTipos
      if (!e) return ['pendiente', 'Se mide al abrir la pestaña Día con «Columnas por tipo», en escritorio.']
      return [e.hueco < 0.15 ? 'ok' : 'mal', `Nuevo · Renovación · Upgrade · Cooperativa · Total ocupan el ancho: hueco a la derecha del ${Math.round(e.hueco * 100)} % (tope 15 %; hoy son unos 930 px vacíos).`]
    }],
    ['En el celular, tarjetas', () => {
      const e = M.telefono
      if (!e) return ['pendiente', 'Pulsa «Teléfono 390» arriba para medirlo.']
      return [e.tarjetas > 0 && !e.paginaScrollLateral ? 'ok' : 'mal', `A ${e.ancho} px: ${e.tarjetas} tarjetas por analista agrupadas por equipo, sin desplazamiento lateral; cada cifra es un botón de 44 px.`]
    }],
    ['Suave y con movimiento', () => ['ok', 'La fila y la columna bajo el cursor se iluminan; las pastillas se elevan y un brillo sigue al cursor; la lista entra deslizándose. Con «reducir movimiento» queda solo el cambio de color.']],
    ['Accesible', () => {
      if (M.contrasteMin == null) return ['pendiente', 'Midiendo…']
      const ok = M.contrasteMin >= 4.5 && M.thSinScope === 0
      return [ok ? 'ok' : 'mal', `${M.botones} botones de verdad, ${M.thConScope} encabezados de tabla con «scope» (${M.thSinScope} sin él), foco visible y contraste mínimo medido de ${String(M.contrasteMin).replace('.', ',')} a 1 (piso 4,5).`]
    }],
  ]

  function pintarReglas() {
    const etiquetas = { ok: 'Cumple', mal: 'No cumple', pendiente: 'Por medir' }
    let ok = 0
    let pendientes = 0
    document.getElementById('m-reglas').innerHTML = REGLAS.map(([titulo, f], i) => {
      const [estadoRegla, texto] = f()
      if (estadoRegla === 'ok') ok += 1
      if (estadoRegla === 'pendiente') pendientes += 1
      return `<li class="m-regla"><span class="m-regla-num">${i + 1}</span><div><h3>${titulo}</h3><p>${esc(texto)}</p></div><span class="m-estado ${estadoRegla}">${etiquetas[estadoRegla]}</span></li>`
    }).join('')
    document.getElementById('m-cuenta').textContent = `Cumple ${ok} de 10${pendientes ? ` (${pendientes} por medir)` : ''} · ver cómo ↓`
  }

  window.addEventListener('message', (ev) => {
    if (ev.source !== lienzo.contentWindow) return
    const m = ev.data
    if (!m || typeof m !== 'object') return
    if (m.tipo === 'listo') enviar({ tipo: 'estado', estado: estado() })
    if (m.tipo === 'lista') M.lista = m.info
    if (m.tipo === 'medidas') {
      const e = m.medidas
      M.ultimo = e
      if (!e.movil) M.escritorio = e
      if (!e.movil && e.gran !== 'dia') M.hoja = e
      if (!e.movil && e.mesEnCurso) M.mesActual = e
      if (!e.movil && e.gran === 'dia' && e.vistaDia === 'tipos') M.diaTipos = e
      if (e.movil) M.telefono = e
      M.letraMin = Math.min(M.letraMin ?? Infinity, e.letraMin ?? Infinity)
      if (e.letraMin != null && e.letraMin <= M.letraMin) M.letraMinTxt = e.letraMinTxt
      M.nombresMin = Math.min(M.nombresMin ?? Infinity, e.nombresMin ?? Infinity)
      M.contrasteMin = Math.min(M.contrasteMin ?? Infinity, e.contrasteMin ?? Infinity)
      M.botones = e.botones
      M.thConScope = e.thConScope
      M.thSinScope = Math.max(M.thSinScope ?? 0, e.thSinScope)
    }
    pintarReglas()
  })
  pintarReglas()
}

if (params.has('lienzo')) arrancarLienzo()
else arrancarMarco()
</script>
